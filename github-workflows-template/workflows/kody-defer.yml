name: Kody defer

# Consumer copy.  Drop this file in .github/workflows/ of a repo that wants
# /defer on Kody review threads.  The implementation lives in
# Simple-With-Us/AI-Fleet-Coordinator and is checked out from `main`.

on:
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  defer:
    if: contains(github.event.comment.body, '/defer')
    uses: Simple-With-Us/AI-Fleet-Coordinator/.github/workflows/kody-defer.yml@main
    with:
      blocked-severities: critical
