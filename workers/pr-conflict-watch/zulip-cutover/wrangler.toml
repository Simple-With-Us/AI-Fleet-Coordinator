name = "pr-conflict-watch"
main = "index.js"
compatibility_date = "2026-08-01"
compatibility_flags = []
keep_vars = true
logpush = false
# GitHub posts to workers.dev, which stays on;  preview URLs stay off.
preview_urls = false

# Runaway backstop per invocation.  One pull request costs at most 6 subrequests
# (3 GitHub reads, KV read, Zulip post, KV write), and handlePr failures are
# caught per pull request.  docs/cloudflare-workers.md has the design.
[limits]
cpu_ms = 50
subrequests = 20

[observability]
enabled = true
head_sampling_rate = 0.1

[[kv_namespaces]]
binding = "PR_STATE"
id = "a759db5d58bc4d2e96fcfec852f97a14"
