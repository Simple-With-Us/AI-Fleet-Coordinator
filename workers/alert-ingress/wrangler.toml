name = "alert-ingress"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Vendors post to workers.dev, which stays on;  preview URLs would keep old
# versions callable after a fix, so they stay off.
preview_urls = false

# Runaway backstop per invocation, and it covers the AlertWriter class too
# (measured peak 36 ms CPU).  docs/cloudflare-workers.md has the design.
[limits]
cpu_ms = 200
subrequests = 30

# The standing status message per topic, and each alertable thing's state.
# This is the namespace the Worker has used since its first deployment, so
# every record it wrote before the vendor cutover stays readable.
[[kv_namespaces]]
binding = "ALERT_STATE"
id = "73264a997a34457da2d3bd45697a5f70"

# One writer serializes state reads, transitions, inventory rendering and the
# Zulip writes, so a standing message is never written twice.
[[durable_objects.bindings]]
name = "ALERT_WRITER"
class_name = "AlertWriter"

[[migrations]]
tag = "alert-writer-v1"
new_sqlite_classes = ["AlertWriter"]

# The sweep that promotes incidents which stayed open past the wait window.
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
