name = "alert-ingress"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The standing status message per topic, and each alertable thing's state.
[[kv_namespaces]]
binding = "ALERT_STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# The sweep that promotes incidents which stayed open past the wait window.
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true