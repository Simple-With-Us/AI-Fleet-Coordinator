name = "alert-ingress"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The standing status message per topic, and each alertable thing's state.
# The id is deliberately empty, not a placeholder-looking string: no namespace
# is created until the deploy boundary for this Worker is decided (accepted
# new runtime, vs. hosting on the existing Coolify app).  An empty id makes the
# deploy fail loudly; a fake id would bind nothing and fail quietly.
[[kv_namespaces]]
binding = "ALERT_STATE"
id = ""

# The sweep that promotes incidents which stayed open past the wait window.
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true