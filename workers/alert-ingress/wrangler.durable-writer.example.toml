# Reviewable deployment template only.  Copy to private configuration and bind
# the approved existing historical namespace before any deployment.
name = "alert-ingress"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[kv_namespaces]]
binding = "ALERT_STATE"
id = ""

[[durable_objects.bindings]]
name = "ALERT_WRITER"
class_name = "AlertWriter"

[[migrations]]
tag = "alert-writer-v1"
new_sqlite_classes = ["AlertWriter"]

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
