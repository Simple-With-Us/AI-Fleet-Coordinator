# Ruff configuration for AI-Fleet-Coordinator
line-length = 100
target-version = "py313"

extend-exclude = [
    "scripts/fleet_rag/tests",
    "scripts/fleet_facts/tests",
    "scripts/fleet_lanes/tests",
    "scripts/agent_sync/tests",
    "scripts/fleet-work-backup",
    "scripts/needs_owner/tests",
    "scripts/open_loops/tests",
]

[lint.per-file-ignores]
# The fleet_config package has to stay importable under Python 3.9,  which the fleet's
# Macs run,  so it cannot use the 3.11+ spelling of UTC (UP017).  The repository's
# target version is newer,  so the rule is turned off for that package alone;  without
# this an automated fix rewrites the package into something that no longer imports on
# the interpreter the fleet runs.
"scripts/fleet_config/**" = ["UP017"]
