# Ruff configuration for AI-Fleet-Coordinator
line-length = 100
target-version = "py313"

# Explicitly named files (autofix.ci passes the changed files) must still honor extend-exclude.
force-exclude = true

extend-exclude = [
    "scripts/fleet_rag/tests",
    "scripts/fleet_facts/tests",
    "scripts/fleet_lanes/tests",
    "scripts/agent_sync/tests",
    "scripts/fleet-work-backup",
    "scripts/needs_owner/tests",
    "scripts/open_loops/tests",
]

# The 3.9 contract for scripts/fleet_lanes (the Mac runs it under /usr/bin/python3).  autofix-ci installs the
# latest ruff and passes no --select, so the default rule set applies:  E4, E7, E9 and F.  The UP (pyupgrade)
# rules and RUF100 are NOT in ruff's default selection,  so the default run never applies a UP rewrite here at
# all.  The lists below are the protection for anyone who DOES select UP (a local `ruff check --select UP`,  or
# a `select` added to this file later);  what actually holds the import contract in CI is the isolated-import
# check in fleet_config's tests,  which imports a copy of the package with `python3 -I`.
#
# per-file-target-version stops every rule that needs a newer Python (UP007, UP045, UP017, UP040, UP041,
# UP046, B905 and future ones).  It does NOT stop UP006 or UP035, which still fire at py39 and rewrite to
# builtin generics and collections.abc imports;  the ignore list below covers those and the older UP rules
# explicitly.  RUF100 is ignored because the package's `# noqa: UP0xx` markers go unused once they are off.
# Every other rule stays on.  See AFC-425.
[per-file-target-version]
"scripts/fleet_lanes/**" = "py39"
"scripts/fleet_config/**" = "py39"
# Muster's helpers and the collectors its LaunchAgents run:  the Mac runs every one of them
# under /usr/bin/python3 (3.9).  An automated fix once rewrote `timezone.utc` to the 3.11+
# `datetime.UTC` here,  which does not import on that interpreter.
"scripts/fleet_knobs/**" = "py39"
"scripts/fleet-ops-control.py" = "py39"
"scripts/fleet-mac-services.py" = "py39"
"scripts/fleet-worker-health.py" = "py39"
"scripts/fleet-tools-doctor.py" = "py39"
"scripts/fleet-server-status.py" = "py39"

[lint.per-file-ignores]
"scripts/fleet_lanes/**" = ["UP006", "UP007", "UP017", "UP035", "UP045", "RUF100"]

# The fleet_config package has the same 3.9 contract:  it runs on the fleet's Macs
# under /usr/bin/python3,  so it cannot use the 3.11+ spelling of UTC (UP017) or the
# other newer-Python spellings.  Without this an automated fix rewrites the package
# into something that no longer imports on the interpreter the fleet runs.  See AFC-425.
"scripts/fleet_config/**" = ["UP006", "UP007", "UP017", "UP035", "UP045", "RUF100"]

# The Muster helpers above:  the same 3.9 contract.  They use `from __future__ import
# annotations`,  so builtin generics and `X | None` in annotations are fine;  UP017 is the one
# rewrite that breaks them.
"scripts/fleet_knobs/**" = ["UP017"]
"scripts/fleet-ops-control.py" = ["UP017"]
"scripts/fleet-mac-services.py" = ["UP017"]
"scripts/fleet-worker-health.py" = ["UP017"]
"scripts/fleet-tools-doctor.py" = ["UP017"]
"scripts/fleet-server-status.py" = ["UP017"]

[format]
# Whitespace churn and py313-only syntax: the 3.9-run package keeps its hand layout.  See AFC-425.
exclude = ["scripts/fleet_lanes/**", "scripts/fleet_config/**"]
