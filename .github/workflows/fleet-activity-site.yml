name: Fleet daily digest + calendars

on:
  schedule:
    # Every 6 hours (aligned with agent-calendar)
    - cron: "25 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: Optional audit note (avoids duplicate-dispatch dedupe)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "scripts/build-fleet-daily-digest.py"
      - "scripts/build-agent-calendar.py"
      - "scripts/ics_utils.py"
      - ".github/workflows/fleet-activity-site.yml"
      - ".github/workflows/agent-calendar.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fleet-activity-site
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build per-commit activity ICS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEET_OWNER: Simple-With-Us
          FLEET_REPOS: Socratic-Trade,Congress.Trade,Usage-Monitor,congress-trading-shared,AI-Fleet-Coordinator,DealDex,Autorotate,ContactLogo,Personal-Site,BotFleet,HogHunter,Clutch,codecaps
          CALENDAR_LOOKBACK_DAYS: "21"
          CALENDAR_PER_REPO: "50"
          CALENDAR_OUT: calendar/agent-activity.ics
        run: python3 scripts/build-agent-calendar.py

      - name: Build daily digest (MD + HTML + ICS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEET_OWNER: Simple-With-Us
          FLEET_REPOS: Socratic-Trade,Congress.Trade,Usage-Monitor,congress-trading-shared,AI-Fleet-Coordinator,DealDex,Autorotate,ContactLogo,Personal-Site,BotFleet,HogHunter,Clutch,codecaps
          DIGEST_LOOKBACK_DAYS: "21"
          DIGEST_TZ: America/Chicago
          SITE_OUT: site
          ICS_OUT: calendar/daily-digest.ics
          SITE_BASE_URL: https://simple-with-us.github.io/AI-Fleet-Coordinator
        run: python3 scripts/build-fleet-daily-digest.py

      # main is ruleset-protected (GH013 on direct push).  Publish the snapshot
      # to published/fleet-activity instead (PS-126 / mirror-site precedent).
      - name: Publish artifacts to data branch
        run: bash scripts/publish-fleet-activity-artifacts.sh

      - name: Upload site for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: fleet-digest-site
          path: site
          retention-days: 1

  deploy-github-pages:
    needs: build-and-publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: fleet-digest-site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: true
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
