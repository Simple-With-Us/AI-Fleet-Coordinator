name: Fleet daily digest + calendars

on:
  schedule:
    # Every 6 hours (aligned with agent-calendar)
    - cron: "25 1,7,13,19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-fleet-daily-digest.py"
      - "scripts/build-agent-calendar.py"
      - "scripts/ics_utils.py"
      - ".github/workflows/fleet-activity-site.yml"
      - ".github/workflows/agent-calendar.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fleet-activity-site
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build per-commit activity ICS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEET_OWNER: jaywedgeworth22
          FLEET_REPOS: Socratic-Trade,Congress.Trade,Usage-Monitor,congress-trading-shared,AI-Fleet-Coordinator,DealDex,Autorotate,ContactLogo,Personal-Site,BotFleet,HogHunter,Clutch,codecaps
          CALENDAR_LOOKBACK_DAYS: "21"
          CALENDAR_PER_REPO: "50"
          CALENDAR_OUT: calendar/agent-activity.ics
        run: python3 scripts/build-agent-calendar.py

      - name: Build daily digest (MD + HTML + ICS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEET_OWNER: jaywedgeworth22
          FLEET_REPOS: Socratic-Trade,Congress.Trade,Usage-Monitor,congress-trading-shared,AI-Fleet-Coordinator,DealDex,Autorotate,ContactLogo,Personal-Site,BotFleet,HogHunter,Clutch,codecaps
          DIGEST_LOOKBACK_DAYS: "21"
          DIGEST_TZ: America/Chicago
          SITE_OUT: site
          ICS_OUT: calendar/daily-digest.ics
          SITE_BASE_URL: https://jaywedgeworth22.github.io/AI-Fleet-Coordinator
        run: python3 scripts/build-fleet-daily-digest.py

      - name: Commit artifacts if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar/agent-activity.ics calendar/daily-digest.ics site/
          if git diff --cached --quiet; then
            echo "No artifact changes."
          else
            git commit -m "chore(site): refresh fleet daily digest + calendars [skip ci]"
            git push || echo "Direct push to main skipped (branch rules require PR); proceeding to deploy Pages artifact."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
