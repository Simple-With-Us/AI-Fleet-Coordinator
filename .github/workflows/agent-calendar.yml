name: Agent Activity Calendar (manual only)

# Per-commit ICS is now built + published by fleet-activity-site.yml.
# Keep this workflow for a one-off rebuild of calendar/agent-activity.ics only
# (no schedule — avoids dual push races with the site workflow).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-activity-calendar
  cancel-in-progress: true

jobs:
  build-ics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ICS feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEET_OWNER: Simple-With-Us
          FLEET_REPOS: Socratic-Trade,Congress.Trade,Usage-Monitor,congress-trading-shared,AI-Fleet-Coordinator,DealDex,Autorotate,ContactLogo,Personal-Site,BotFleet,HogHunter,Clutch,codecaps
          CALENDAR_LOOKBACK_DAYS: "21"
          CALENDAR_PER_REPO: "50"
          CALENDAR_OUT: calendar/agent-activity.ics
        run: python3 scripts/build-agent-calendar.py

      - name: Restore site tree from published branch for snapshot push
        run: |
          set -euo pipefail
          git fetch --no-tags origin published/fleet-activity 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/published/fleet-activity; then
            git archive origin/published/fleet-activity site | tar -x
          else
            python3 scripts/build-fleet-daily-digest.py
          fi

      - name: Publish artifacts to data branch
        run: bash scripts/publish-fleet-activity-artifacts.sh
