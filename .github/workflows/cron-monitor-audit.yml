name: Cron monitor audit

# Read-only. Lists Sentry cron monitors and matches them to check-in
# senders in fleet workflows and scripts. Does not create, edit, or delete
# monitors. Pull requests run the unit tests only. The audit step is not a
# pull_request step, so pull-request code never sees the Sentry token.
# If SENTRY_AUTH_TOKEN_FULLSCOPE is not configured, the scheduled job exits
# 0 and posts a notice. SENTRY_AUTH_TOKEN cannot list monitors (HTTP 403).

on:
  schedule:
    # Monday 15:17 UTC. During standard time that is 9:17am on the owner clock.
    - cron: "17 15 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/cron-monitor-audit/**"
      - ".github/workflows/cron-monitor-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test the cron monitor audit
        working-directory: scripts/cron-monitor-audit
        run: python3 -m unittest discover -s tests -t . -v

      - name: Compare cron monitors with check-in senders
        if: github.event_name != 'pull_request'
        working-directory: scripts/cron-monitor-audit
        env:
          SENTRY_AUTH_TOKEN_FULLSCOPE: ${{ secrets.SENTRY_AUTH_TOKEN_FULLSCOPE }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! python3 -c 'import os,sys; token=os.environ.get("SENTRY_AUTH_TOKEN_FULLSCOPE","") or os.environ.get("SENTRY_AUTH_TOKEN",""); sys.exit(0 if token.strip() else 1)'; then
            echo "::notice::SENTRY_AUTH_TOKEN_FULLSCOPE is not configured for this repository. It needs alerts:read or org:read on GET /api/0/organizations/simple-with-us/monitors/. SENTRY_AUTH_TOKEN returns HTTP 403 on that endpoint. Skipping the cron monitor audit."
            exit 0
          fi
          set +e
          python3 -m cron_monitor_audit --markdown "$GITHUB_STEP_SUMMARY"
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "::notice::The configured Sentry token cannot list cron monitors (HTTP 403). Add repository secret SENTRY_AUTH_TOKEN_FULLSCOPE with alerts:read or org:read. SENTRY_AUTH_TOKEN is not accepted on this endpoint."
            exit 0
          fi
          exit "$code"
