name: Sentry CI Report

# Fleet-wide CI observability for this repository.  The reporter itself is the
# shared workflow_call in .github/workflows/sentry-ci-report-reusable.yml;  this
# file is the thin listener that names this repository's own workflows and
# hands the shared reporter the per-caller data it cannot know for itself.
# It reports actionable events to the shared `fleet-infra` Sentry project (org
# simple-with-us).  ADDITIVE ONLY — this file must never modify the behavior
# of the workflows it observes.
#
# It listens on BOTH activity types:  "requested" opens the Sentry Crons
# check-in before the observed run finishes,  and "completed" closes it with
# the run's outcome.
#
# Two independent signals per completed run:
#   1. On conclusion == failure / timed_out / startup_failure: a Sentry error
#      event, tagged with {app, workflow, branch, actor}, carrying the run URL,
#      fingerprinted on [ci-failure, app, workflow] so every failure of one
#      workflow groups into ONE Sentry issue instead of paging separately every
#      time.  The branch is a TAG only, never a fingerprint component (it was
#      until 2026-08-12, which minted a permanent issue per feature branch —
#      ~85 of the fleet's unresolved fleet-infra issues).  The `app` tag +
#      fingerprint component are REQUIRED: the fleet-infra project is shared
#      across repos, and this repo shares workflow names ("CI", "Security",
#      "Effort Issues Sync") with peer apps, so without `app` a "CI" failure
#      here would dedup into the same Sentry issue as a "CI" failure there.
#      See FLEET-PROTOCOL.md "Observability".
#   2. On event == schedule (i.e. the completed run was a cron-triggered
#      run of a workflow that defines `schedule:`): a Sentry Crons check-in
#      (ok on success, error on failure) with an upsert monitor_config whose
#      schedule mirrors that workflow's own cron expression, slug
#      `ci-AI-Fleet-Coordinator-<workflow-slug>`.  This means a nightly/weekly job that
#      silently STOPS firing (not "runs and fails" but "never runs again")
#      raises a missed-check-in alert instead of going unnoticed.
#
# workflows observed (from `ls .github/workflows/` at authoring time — see
# the `name:` header of each file):
#   Agent Activity Calendar (manual only),
#   Backup fleet GitHub repositories,
#   Fleet daily digest + calendars
#
# DELIBERATELY NOT observed:
#   - Sentry CI Report (this file) — would recurse.
#   - Sentry CI Report (Reusable) — the shared reporter,  for the same reason.
#
# Cron schedules mirrored for the check-in step (must match the source
# workflow's `schedule:` block AND its `name:`; keep in sync if those change).
# The reporter validates these keys against the observed names on every
# run and raises a Sentry issue on drift, so a rename cannot silently kill a
# monitor:
#   Backup fleet GitHub repositories        -> "0 7 * * *"  (backup-repos.yml, daily)
#   Fleet daily digest + calendars          -> "25 1,7,13,19 * * *"  (fleet-activity-site.yml)
#
# Secret: repo (or org) Actions secret `SENTRY_FLEET_DSN` must be set to the
# fleet-infra project DSN.  Name only — never commit or print the value.
# Already provisioned on this repo (do not reset).  The reporter exits 0 with
# a warning when the secret is absent, so CI itself is never red-X'd by a
# missing DSN.
#
# Gold copy: Usage-Monitor origin/main (PR #1394).  Adapted for AI-Fleet-Coordinator.

on:
  workflow_run:
    workflows:
      # Names must match the `name:` field of workflow files exactly —
      # a stale entry here silently disables alerting for that pipeline.
      - Agent Activity Calendar (manual only)
      - Backup fleet GitHub repositories
      - Fleet daily digest + calendars
    # Both activity types,  not just "completed".  The shared reporter has two
    # phases:  the requested phase sends the in_progress check-in that OPENS the
    # Sentry Crons monitor before the observed run finishes,  and the completed
    # phase sends the terminal check-in that closes it with the run's outcome.
    # With "completed" alone the monitor only ever sees the terminal check-in,
    # so its checkin_margin has to cover the whole observed runtime and a slow
    # but healthy run can still page as a missed check-in.
    types: [requested, completed]

permissions:
  contents: read
  # The reporter asks the Actions API whether the observed run already
  # finished,  and the called workflow can only narrow the caller's grants.
  actions: read

concurrency:
  group: sentry-ci-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    permissions:
      contents: read
      actions: read
    # The `uses:` ref and the `reusable_ref` input MUST be the same SHA:  the
    # shared workflow checks its own script out of this repository at
    # `reusable_ref` and refuses to run when the checked-out commit differs.
    # The reusable additionally pins the reporter script by BLOB SHA,  and that
    # blob survives a squash,  a rebase and a merge,  so re-pinning the commit
    # below to the merge SHA does not invalidate it.
    #
    # TODO(OWNER):  this pins the branch commit that carries the reusable,  so
    # the workflow loads and runs as soon as the branch is pushed.  Re-pin both
    # values to the merge SHA of .github/workflows/sentry-ci-report-reusable.yml
    # once that merge exists,  so the reporter runs the merged copy rather
    # than this branch's copy.
    uses: Simple-With-Us/AI-Fleet-Coordinator/.github/workflows/sentry-ci-report-reusable.yml@b59d85c173ae8a52acf0cab93643ca6d35d84c3e
    with:
      observed_workflows: '["Agent Activity Calendar (manual only)", "Backup fleet GitHub repositories", "Fleet daily digest + calendars"]'
      cron_schedules: '{"Backup fleet GitHub repositories": "0 7 * * *", "Fleet daily digest + calendars": "25 1,7,13,19 * * *"}'
      reusable_ref: b59d85c173ae8a52acf0cab93643ca6d35d84c3e
      app: AI-Fleet-Coordinator
    secrets:
      SENTRY_FLEET_DSN: ${{ secrets.SENTRY_FLEET_DSN }}
