name: Kody MiniMax M3 Fix Proposals (Reusable)

# Separate from the legacy Codex autofix workflow.  No secrets are inherited.
# The trusted helper is independently pinned to its immutable publication commit.
# Provider: MiniMax M3.1 Flash through MiniMax's OpenAI-compatible chat completions (owner 2026-10-20).
# Callers forward MODEL_API_KEY explicitly from the provider-specific organization secret.
#
# Canonical home:  this repository now holds the fleet's shared reusable workflows,  so this
# file is the one copy every caller pins.  The helper it pins is still
# Simple-With-Us/congress-trading-shared/.github/kody-autofix at the commit below,  because
# the helper source lives there;  only the workflow that calls it lives here.
#
# Infisical /github-org preflight:  the fleet-ops prod /github-org folder holds the org-wide
# provider keys,  so a caller that cannot hold the provider secret itself can instead pass the
# universal-auth machine identity of this repository and let the preflight fetch the key at
# run time.  The preflight runs in the same job as the model call,  because a masked value
# cannot travel through a job output.  The fetch script is checked out from this repository at
# a pinned commit,  so a pull-request branch can never substitute the fetch logic.
on:
  workflow_call:
    inputs:
      repository_id:
        description: Exact numeric ID of the calling repository
        required: true
        type: string
      profile:
        description: Reviewed source profile (web, swift, python, static, or blocked)
        required: true
        type: string
      source_prefixes:
        description: JSON array of explicit source-directory prefixes or exact source files
        required: true
        type: string
      daily_attempt_limit:
        description: Approved per-repository daily attempt slots; zero disables paid work
        required: false
        type: number
        default: 0
      budget_policy_id:
        description: Approved allocation identifier; pending disables paid work
        required: false
        type: string
        default: pending
      model:
        description: Provider model identifier; the helper rejects anything outside its strict pattern
        required: false
        type: string
        default: MiniMax-M3.1-Flash
      model_base_url:
        description: OpenAI-compatible base URL; the helper accepts only its reviewed allowlist
        required: false
        type: string
        default: https://api.minimax.io/v1
    secrets:
      MODEL_API_KEY:
        description: Provider key for model_base_url, forwarded explicitly by the caller.  Optional when the Infisical /github-org preflight supplies the credential instead.
        required: false
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:
        description: Universal-auth client id for the fleet-ops prod /github-org preflight.  Optional when the caller forwards MODEL_API_KEY.
        required: false
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:
        description: Universal-auth client secret for the fleet-ops prod /github-org preflight.  Optional when the caller forwards MODEL_API_KEY.
        required: false
      USAGE_INGEST_TOKEN:
        description: Usage Monitor ingest token scoped to the ci-autofix producer, forwarded explicitly by the caller.  Optional;  without it the usage report is skipped.
        required: false

permissions: {}

env:
  EXPECTED_REPOSITORY_ID: ${{ inputs.repository_id }}
  PROFILE: ${{ inputs.profile }}
  SOURCE_PREFIXES: ${{ inputs.source_prefixes }}
  DAILY_ATTEMPT_LIMIT: ${{ inputs.daily_attempt_limit }}
  BUDGET_POLICY_ID: ${{ inputs.budget_policy_id }}
  CHECK_RUN_ID: ${{ github.event.check_run.id }}

jobs:
  prepare:
    if: >-
      vars.SWU_KODY_AUTOFIX_ENABLED == 'true' &&
      inputs.daily_attempt_limit > 0 && inputs.budget_policy_id != 'pending' &&
      inputs.profile != 'blocked' &&
      github.event_name == 'check_run' && github.event.action == 'completed' &&
      github.run_attempt == 1 &&
      github.event.check_run.app.id == 413034 &&
      github.event.sender.type == 'Bot' && github.event.sender.id == 148880201 &&
      github.event.sender.login == 'kody-ai[bot]' &&
      github.event.check_run.conclusion == 'success' &&
      github.event.check_run.pull_requests[0].number != null &&
      github.event.check_run.pull_requests[1] == null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      eligible: ${{ steps.prepare.outputs.eligible }}
      pr_number: ${{ steps.prepare.outputs.pr_number }}
      result: ${{ steps.prepare.outputs.result }}
      utc_day: ${{ steps.clock.outputs.utc_day }}
    steps:
      - name: Check Out Trusted Helper Only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Simple-With-Us/congress-trading-shared
          ref: 'cb956e7a81f657b50acc71de9956548addd9ad6b'
          path: trusted-helper
          persist-credentials: false
          sparse-checkout: .github/kody-autofix
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Trusted Helper Dependencies
        working-directory: trusted-helper/.github/kody-autofix
        run: npm ci
      - name: Record UTC Reservation Day
        id: clock
        shell: bash
        run: printf 'utc_day=%s\n' "$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Validate Check And Snapshot Eligible Findings
        id: prepare
        run: node trusted-helper/.github/kody-autofix/fleet.mjs prepare "$RUNNER_TEMP/kody-autofix"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.prepare.outputs.eligible == 'true'
        with:
          name: kody-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kody-autofix/snapshot.json
          if-no-files-found: error
          retention-days: 1

  reserve:
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: kody-reserve-${{ github.repository_id }}-${{ needs.prepare.outputs.utc_day }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      checks: read
      actions: read
    outputs:
      reserved: ${{ steps.reserve.outputs.reserved }}
      result: ${{ steps.reserve.outputs.result }}
    steps:
      - name: Check Out Trusted Helper Only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Simple-With-Us/congress-trading-shared
          ref: 'cb956e7a81f657b50acc71de9956548addd9ad6b'
          path: trusted-helper
          persist-credentials: false
          sparse-checkout: .github/kody-autofix
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Trusted Helper Dependencies
        working-directory: trusted-helper/.github/kody-autofix
        run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kody-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kody-autofix
      - name: Reserve Create-Only Daily Slot And PR Head Attempt
        id: reserve
        run: node trusted-helper/.github/kody-autofix/fleet.mjs reserve "$RUNNER_TEMP/kody-autofix"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.reserve.outputs.reserved == 'true'
        with:
          name: kody-reservation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kody-autofix/reservation.json
          if-no-files-found: error
          retention-days: 1

  generate:
    needs: [prepare, reserve]
    if: needs.reserve.outputs.reserved == 'true'
    environment: kody-autofix
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      # Fail fast when the caller supplied no credential at all,  before the
      # scanner and the helper run.  Only the presence flags travel in the
      # environment;  the key itself stays in the secret context.
      - name: Require A Provider Credential
        shell: bash
        env:
          HAS_FORWARDED: ${{ secrets.MODEL_API_KEY != '' }}
          HAS_INFISICAL: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID != '' && secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_FORWARDED" != "true" ] && [ "$HAS_INFISICAL" != "true" ]; then
            echo "::error::no provider credential: forward MODEL_API_KEY or grant the Infisical /github-org preflight"
            exit 1
          fi
      - name: Check Out Trusted Helper Only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Simple-With-Us/congress-trading-shared
          ref: 'cb956e7a81f657b50acc71de9956548addd9ad6b'
          path: trusted-helper
          persist-credentials: false
          sparse-checkout: .github/kody-autofix
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Trusted Helper Dependencies
        working-directory: trusted-helper/.github/kody-autofix
        run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kody-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kody-autofix
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kody-reservation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kody-autofix
      - name: Install Verified Gitleaks Scanner
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/kody-tools"
          mkdir -p "$tools_dir"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --max-time 60 --retry 0 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tools_dir/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$tools_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$tools_dir/gitleaks.tar.gz" --directory "$tools_dir" \
            --no-same-owner --no-same-permissions gitleaks
          chmod 0755 "$tools_dir/gitleaks"
      - name: Reject Secret-Bearing Context Before Provider Credentials
        run: node trusted-helper/.github/kody-autofix/fleet.mjs scan "$RUNNER_TEMP/kody-autofix"
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/kody-tools/gitleaks
      # The provider credential enters the job only after the context scan above,  so the
      # scan really does run without it.  A caller that forwards MODEL_API_KEY wins over the
      # preflight;  a caller that does not gets the key from the Infisical /github-org path.
      - name: Check Out The Trusted Infisical Fetch Script
        if: ${{ secrets.MODEL_API_KEY == '' && secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID != '' && secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805da76410c181273ba90b1 # v7.0.1
        with:
          repository: Simple-With-Us/AI-Fleet-Coordinator
          # Pinned to the commit that carries scripts/infisical-fetch.mjs.  Advance this SHA
          # when that script changes;  the pin is what keeps a pull-request branch from
          # substituting the fetch logic.
          ref: 'afa98765961c4a88c88b2a078e0c2120b73b8fea'
          path: trusted-infisical
          persist-credentials: false
          sparse-checkout: scripts/infisical-fetch.mjs
          sparse-checkout-cone-mode: false
      - name: Load MiniMax from Infisical /github-org (same job; no job outputs)
        if: ${{ secrets.MODEL_API_KEY == '' && secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID != '' && secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET != '' }}
        shell: bash
        env:
          INFISICAL_NAMES: MINIMAX_API_KEY
          INFISICAL_REQUIRED: MINIMAX_API_KEY
          INFISICAL_PROJECT_ID: 8dae6d03-8f12-48b2-adf3-e5c1b881c8c5
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_SECRET_PATH: /github-org
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
        run: node trusted-infisical/scripts/infisical-fetch.mjs
      - name: Wire The Provider Credential
        shell: bash
        env:
          FORWARDED_MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$FORWARDED_MODEL_API_KEY" ]; then
            echo "MODEL_API_KEY=$FORWARDED_MODEL_API_KEY" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "${MINIMAX_API_KEY:-}" ]; then
            echo "::error::no provider credential: forward MODEL_API_KEY or grant the Infisical /github-org preflight"
            exit 1
          fi
          echo "MODEL_API_KEY=$MINIMAX_API_KEY" >> "$GITHUB_ENV"
      # One bounded chat-completions request from the trusted helper; no CLI, tools, or proxy.
      - name: Generate One Bounded Proposal
        run: node trusted-helper/.github/kody-autofix/fleet.mjs generate "$RUNNER_TEMP/kody-autofix"
        env:
          KODY_MODEL: ${{ inputs.model }}
          KODY_MODEL_BASE_URL: ${{ inputs.model_base_url }}
      - name: Reject Secret-Bearing Generated Results
        run: node trusted-helper/.github/kody-autofix/fleet.mjs scan-answer "$RUNNER_TEMP/kody-autofix"
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/kody-tools/gitleaks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kody-answer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kody-autofix/answer.json
            ${{ runner.temp }}/kody-autofix/answer-scan.json
          if-no-files-found: error
          retention-days: 1
      # Token counts and a model id only, written by the helper from the provider's own usage block.
      # Uploaded even when generation or scanning failed, because the provider may still have billed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kody-usage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kody-autofix/usage.json
          if-no-files-found: ignore
          retention-days: 1

  publish:
    needs: [prepare, reserve, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: kody-publish-${{ github.repository_id }}-${{ needs.prepare.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
    steps:
      - name: Check Out Trusted Helper Only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Simple-With-Us/congress-trading-shared
          ref: 'cb956e7a81f657b50acc71de9956548addd9ad6b'
          path: trusted-helper
          persist-credentials: false
          sparse-checkout: .github/kody-autofix
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Trusted Helper Dependencies
        working-directory: trusted-helper/.github/kody-autofix
        run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kody-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kody-autofix
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kody-reservation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kody-autofix
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kody-answer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kody-autofix
      - name: Revalidate And Create Draft Proposal
        run: node trusted-helper/.github/kody-autofix/fleet.mjs publish "$RUNNER_TEMP/kody-autofix"
        env:
          GH_TOKEN: ${{ github.token }}

  # Best-effort metering (UM-1593).  Holds no provider key and no write permission;  a missing
  # USAGE_INGEST_TOKEN or a missing usage file makes it a quiet no-op, and it cannot fail the run.
  meter:
    needs: [prepare, generate]
    if: ${{ always() && needs.generate.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: kody-usage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kody-autofix
      - name: Report Usage To Usage Monitor
        continue-on-error: true
        uses: Simple-With-Us/congress-trading-shared/.github/actions/ci-usage-report@65f9ff5a5b1f7a68e729205c14f5ef3e59be561a
        with:
          token: ${{ secrets.USAGE_INGEST_TOKEN }}
          harness: kody
          input-file: ${{ runner.temp }}/kody-autofix/usage.json
          input-kind: kody
          model: ${{ inputs.model }}
          pr-number: ${{ needs.prepare.outputs.pr_number }}
          step: generate
          workflow: kody-autofix-reusable
