name: Deploy mapped Workers
on:
  push:
    branches: [main]
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mapped-workers-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.WORKER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        worker: ["agent-sync-mcp", "alert-ingress"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: scripts/agent-sync-mcp
      - run: echo "$GITHUB_WORKSPACE/scripts/agent-sync-mcp/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm test
        working-directory: scripts/agent-sync-mcp
      - run: node --test workers/pr-conflict-watch/state.test.js
      - run: node --test workers/alert-ingress/src/*.test.js
      - run: python3 scripts/test-deploy-mapped-worker.py
      - name: Load scoped deploy credential from Fleet-OPS
        env:
          INFISICAL_PROJECT_ID: 8dae6d03-8f12-48b2-adf3-e5c1b881c8c5
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_SECRET_PATH: /
          INFISICAL_NAMES: CLOUDFLARE_FLEET_API_TOKEN
          INFISICAL_REQUIRED: CLOUDFLARE_FLEET_API_TOKEN
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_AUTOMATION_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_AUTOMATION_CLIENT_SECRET }}
        run: node scripts/infisical-fetch.mjs
      - name: Deploy exact main and verify receipt
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_FLEET_API_TOKEN }}
          WORKER_HEALTH_ACCESS_CLIENT_ID: ${{ secrets.WORKER_HEALTH_ACCESS_CLIENT_ID }}
          WORKER_HEALTH_ACCESS_CLIENT_SECRET: ${{ secrets.WORKER_HEALTH_ACCESS_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: 3a9368057468d0909cafaa85df12d1b7
          TARGET: ${{ matrix.worker }}
        run: python3 scripts/deploy-mapped-worker.py "$TARGET"
