name: PR Autofix

# Thin caller for the fleet's shared autofix.  The steps live in pr-autofix-reusable.yml;  see
# docs/PR-AUTOFIX.md.  Other repos call it as
# Simple-With-Us/AI-Fleet-Coordinator/.github/workflows/pr-autofix-reusable.yml@<sha>.

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

# The reusable's GITHUB_TOKEN is capped by these grants:  marker comments
# (issues: write), PR reads (pull-requests: read), and the no-app push
# fallback (contents: write).  Owner-approved 2026-10-21.
permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: pr-autofix-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  autofix:
    # Checked here too so a human comment never starts a runner.
    if: >
      (github.event.issue.pull_request || github.event.pull_request) &&
      (github.event.issue.state == 'open' || github.event.pull_request.state == 'open') &&
      (
        (github.event_name == 'pull_request_review' && contains(fromJSON('["bot", "Bot"]'), github.event.review.user.type)) ||
        (github.event_name != 'pull_request_review' && contains(fromJSON('["bot", "Bot"]'), github.event.comment.user.type))
      )
    permissions:
      contents: write
      pull-requests: read
      issues: write
      actions: read
    uses: ./.github/workflows/pr-autofix-reusable.yml
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      META_MODEL_API_TOKEN: ${{ secrets.META_MODEL_API_TOKEN }}
      AUTOFIX_GITHUB_APP_PRIVATE_KEY: ${{ secrets.SWU_AUTOFIX_GITHUB_APP_PRIVATE_KEY }}
      USAGE_INGEST_TOKEN: ${{ secrets.USAGE_INGEST_TOKEN }}
