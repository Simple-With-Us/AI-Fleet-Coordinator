name: autofix.ci

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: autofix-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Format Python code with Ruff
        run: |
          pip install --upgrade ruff
          ruff format scripts/ tests/ || true
          ruff check --fix-only scripts/ tests/ || true

      - uses: autofix-ci/action@v1
        with:
          fail-fast: false
