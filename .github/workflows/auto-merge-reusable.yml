name: Auto-merge reusable (fleet)

# The fleet's shared auto-merge armer.  Callers live in each repo as a thin
# workflow on pull_request events that calls this file with `uses:`;  see
# docs/AUTO-MERGE.md for the caller template and input reference.
#
# Origin: Socratic-Trade's .github/workflows/auto-merge-prs.yml, cloned
# per-repo in the jaywedgeworth22 personal-account days when there was no org
# layer for a shared credential or workflow.  The copies drifted (ST grew a
# CODEOWNERS money-path gate; CT/UM arm on everything), and each needed its
# own token.  One reusable ends the drift; repo policy moves into caller
# inputs.
#
# Why arming requires an elevated token (secrets.merge_token):  GitHub raises
# no workflow events for anything done with the repository's GITHUB_TOKEN.
# A merge attributed to github-actions[bot] dispatches nothing -- no CI, no
# ship workflows on main.  So the merge token must be a PAT or a GitHub App
# installation token.  Without one this workflow no-ops LOUDLY (notice + arm
# skipped); it never falls back to GITHUB_TOKEN for arming.  Disarming may
# fall back, because disabling never merges.
#
# The presence guard is not enough on its own:  a revoked or expired token is
# present and then 401s mid-step (Socratic-Trade ST-4393, 2026-10-08).  The
# arm job therefore probes the credential with an authenticated API call
# before use and fails with "token present but rejected" when it is dead.
#
# The event context in a reusable workflow is the caller's, so
# github.event.pull_request below is the caller's PR.

on:
  workflow_call:
    inputs:
      require_codeowners_gate:
        description: >-
          When true, PRs touching paths in the base branch's .github/CODEOWNERS
          are not armed (human merge required) and any armed merge is disabled.
        type: boolean
        default: false
      gate_script:
        description: >-
          Caller-repo script, read from the BASE branch (never the PR head), that
          exit-0s when given `--files <path>...` touch protected paths and exit-1s
          otherwise.  Required when require_codeowners_gate is true.  Reads the
          CODEOWNERS_FILE env for the CODEOWNERS copy to match against.
        type: string
        default: ""
      self_guard_paths:
        description: >-
          Comma-separated repo-relative paths.  A PR touching any of them edits
          the gate itself, so it is never armed.
        type: string
        default: ""
      restrict_to_pattern:
        description: >-
          Extended regex.  When set, only PRs whose head branch or title matches
          are armed (dependency-bump lanes).
        type: string
        default: ""
      hold_labels:
        description: >-
          Comma-separated label names that block arming and disable any armed
          merge.
        type: string
        default: "do-not-automerge,needs-human-merge"
      kody_check_name:
        description: >-
          Check-run name of the fleet reviewer whose running check blocks arming
          (owner rule 2026-10-21).  An input so a reviewer rename is a caller
          change, not a silent gap.
        type: string
        default: "Kody Code Review"
      require_current_approval:
        description: >-
          When true (the default), a PR is armed only while the fleet reviewer
          has an APPROVED review on the PR's CURRENT head commit, and any armed
          merge is disabled otherwise.  A skipped or missing review check, a
          COMMENTED review, or an approval on an older commit does not count.
          There is no implicit exemption: restrict_to_pattern matches a PR title,
          which any author controls, so a dependency-bump caller that wants no
          review gate must set this to false explicitly.
        type: boolean
        default: true
      approval_reviewer:
        description: >-
          Login of the reviewer whose APPROVED review on the head commit
          qualifies a PR for arming.
        type: string
        default: "kody-ai[bot]"
      delete_branch:
        description: Delete the head branch after merge.
        type: boolean
        default: true
    secrets:
      merge_token:
        description: >-
          PAT or GitHub App installation token with contents + pull-requests
          write.  Probed before use; absent means a loud no-op.
        required: false

permissions:
  contents: read
  pull-requests: read
  # The in-flight gates below read the head commit's check runs (Kodus review)
  # and the head branch's workflow runs (autofix lanes).
  checks: read
  actions: read
  issues: read

jobs:
  classify:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        if: inputs.require_codeowners_gate
        with:
          # The gate script and CODEOWNERS come from the base branch, never the
          # PR head: an old or hostile branch cannot weaken the gate.
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1
      - name: Classify PR for auto-merge eligibility
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          KODY_CHECK_NAME: ${{ inputs.kody_check_name }}
          REQUIRE_APPROVAL: ${{ inputs.require_current_approval }}
          APPROVAL_REVIEWER: ${{ inputs.approval_reviewer }}
          MERGE_TOKEN: ${{ secrets.merge_token }}
          RESTRICT: ${{ inputs.restrict_to_pattern }}
          SELF_GUARD: ${{ inputs.self_guard_paths }}
          HOLD_LABELS: ${{ inputs.hold_labels }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          REQUIRE_GATE: ${{ inputs.require_codeowners_gate }}
          GATE_SCRIPT: ${{ inputs.gate_script }}
        run: |
          set -euo pipefail
          skip() { echo "skip=true" >> "$GITHUB_OUTPUT"; echo "reason=$1" >> "$GITHUB_OUTPUT"; echo "::notice::not arming auto-merge: $1"; exit 0; }
          trap 'skip "classifier failed - fail closed"' ERR

          # Hold labels
          IFS=',' read -ra holds <<< "$HOLD_LABELS"
          for h in "${holds[@]}"; do
            if printf '%s' "$LABELS_JSON" | jq -e --arg h "$h" 'index($h) != null' >/dev/null; then
              skip "hold label '$h' present"
            fi
          done

          # Owner rule 2026-10-21: never merge while a Kodus review is running on
          # the head commit or an autofix run involving this PR is queued or in
          # progress.  skip=trues here also disarm any already-armed merge via the
          # disarm job, and every lookup fails closed.
          GATE_TOKEN="$MERGE_TOKEN"
          [ -n "$GATE_TOKEN" ] || GATE_TOKEN="$GH_TOKEN"

          kody_status="$RUNNER_TEMP/kody-status.txt"
          # Filter server-side by the caller-supplied check name and paginate: an
          # unfiltered per_page=100 listing can truncate the Kody run out of the
          # window.  gh adds -f fields to the query string on GET.
          if ! GH_TOKEN="$GATE_TOKEN" gh api "repos/$REPO/commits/$HEAD/check-runs"                -f per_page=100 -f check_name="$KODY_CHECK_NAME" --paginate                --jq '.check_runs[].status' > "$kody_status" 2>"$RUNNER_TEMP/kody.err"; then
            cat "$RUNNER_TEMP/kody.err" >&2
            skip "Kodus review check lookup failed - fail closed"
          fi
          if grep -qxE 'queued|in_progress' "$kody_status"; then
            skip "Kodus review running on head $HEAD"
          fi

          # Autofix lanes fire on issue_comment and check_run events, so their runs
          # attach to the DEFAULT branch, never the PR head branch -- filtering runs
          # by the head branch would never see them.  Two precise sources instead:
          # the per-PR marker comments the lanes leave (they carry the run id), and
          # repo-wide active runs whose pull_requests list this PR.
          # Comment bodies are user-controlled text: never persist them.  jq
          # reduces each comment to its marker run id inside gh, so only run ids
          # reach the runner disk.  Markers count only when a Bot wrote them: a
          # human commenter could otherwise forge one with a bogus run id and
          # disarm the gate.  Only the 50 newest run ids are queried, so
          # long-lived PRs do not spend the token's quota on ancient history.
          if ! GH_TOKEN="$GATE_TOKEN" gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f per_page=100 --paginate                --jq '.[] | select(.user.type == "Bot") | .body | select(contains("swu-autofix-run: bot=")) | [scan("actions/runs/[0-9]+") | sub("actions/runs/";"")] | .[]'                > "$RUNNER_TEMP/marker-runs.raw" 2>"$RUNNER_TEMP/comments.err"; then
            cat "$RUNNER_TEMP/comments.err" >&2
            skip "PR comment lookup failed - fail closed"
          fi
          sort -un "$RUNNER_TEMP/marker-runs.raw" | tail -50 > "$RUNNER_TEMP/marker-runs.txt"
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            if run_json="$(GH_TOKEN="$GATE_TOKEN" gh api "repos/$REPO/actions/runs/$run_id" 2>"$RUNNER_TEMP/run-err.txt")"; then
              run_status="$(printf '%s' "$run_json" | jq -r '.status')"
            elif grep -q 'HTTP 404' "$RUNNER_TEMP/run-err.txt"; then
              # Retention deleted the run, so it cannot be in flight.
              continue
            else
              cat "$RUNNER_TEMP/run-err.txt" >&2
              skip "autofix run status lookup failed - fail closed"
            fi
            if [ "$run_status" = "queued" ] || [ "$run_status" = "in_progress" ]; then
              skip "autofix run $run_id $run_status on this PR"
            fi
          done < "$RUNNER_TEMP/marker-runs.txt"

          runs_out="$RUNNER_TEMP/autofix-runs.txt"
          : > "$runs_out"
          for st in queued in_progress; do
            if ! GH_TOKEN="$GATE_TOKEN" gh api "repos/$REPO/actions/runs?status=$st&per_page=100" --jq '.workflow_runs[] | {path, prs: [.pull_requests[].number]} | @json' >> "$runs_out" 2>"$RUNNER_TEMP/runs.err"; then
              cat "$RUNNER_TEMP/runs.err" >&2
              skip "autofix run lookup failed - fail closed"
            fi
          done
          if jq -e --argjson pr "$PR_NUMBER" 'select(.path == ".github/workflows/autofix.yml" or .path == ".github/workflows/claude-code-autofix.yml" or .path == ".github/workflows/kody-fleet-autofix.yml") | select(.prs | index($pr) != null)' "$runs_out" > /dev/null 2>&1; then
            skip "autofix run queued or in progress for PR #$PR_NUMBER"
          fi

          # Qualified current review: a green CI plus a skipped or stale review check
          # must not arm a merge.  Only an APPROVED review by the fleet reviewer on
          # this exact head commit qualifies; a newer push makes the old approval
          # not count, and the next pull_request or pull_request_review event
          # re-evaluates.  No implicit lane exemption (the lane pattern matches a
          # title the author controls); callers opt out with the input.  The
          # lookup fails closed.
          if [ "${REQUIRE_APPROVAL:-true}" = "true" ]; then
            reviews_out="$RUNNER_TEMP/reviews.txt"
            reviews_raw="$RUNNER_TEMP/reviews.json"
            if ! GH_TOKEN="$GATE_TOKEN" gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" -f per_page=100 --paginate \
                 > "$reviews_raw" 2>"$RUNNER_TEMP/reviews.err" \
               || ! jq -r --arg who "$APPROVAL_REVIEWER" --arg head "$HEAD" \
                 '.[] | select(.user.login == $who and .commit_id == $head) | .state' \
                 "$reviews_raw" > "$reviews_out" 2>>"$RUNNER_TEMP/reviews.err"; then
              cat "$RUNNER_TEMP/reviews.err" >&2
              skip "review lookup failed - fail closed"
            fi
            latest="$(tail -n 1 "$reviews_out" || true)"
            if grep -qx 'CHANGES_REQUESTED' "$reviews_out" && [ "$latest" != "APPROVED" ]; then
              skip "changes requested on head $HEAD"
            fi
            [ "$latest" = "APPROVED" ] || skip "no current-head approval from $APPROVAL_REVIEWER on $HEAD"
          fi

          # Lane restriction (dependency-bump callers)
          if [ -n "$RESTRICT" ]; then
            if ! [[ "$HEAD_REF" =~ $RESTRICT ]] && ! [[ "$TITLE" =~ $RESTRICT ]]; then
              skip "outside restricted lane /$RESTRICT/"
            fi
          fi

          # Changed files via the compare API (three-dot = merge-base..head)
          cmp_out="$RUNNER_TEMP/compare.txt"
          if ! gh api "repos/$REPO/compare/${BASE}...${HEAD}" --paginate -q '.files[].filename' > "$cmp_out" 2>"$RUNNER_TEMP/compare.err"; then
            cat "$RUNNER_TEMP/compare.err" >&2
            skip "compare API failed - fail closed"
          fi
          mapfile -t changed_files < "$cmp_out"
          [ ${#changed_files[@]} -gt 0 ] || skip "compare API returned no files - fail closed"

          # Self-guard: PR edits the gate itself
          if [ -n "$SELF_GUARD" ]; then
            IFS=',' read -ra guards <<< "$SELF_GUARD"
            for f in "${changed_files[@]}"; do
              for g in "${guards[@]}"; do
                [ "$f" = "$g" ] && skip "PR edits the auto-merge gate ($f)"
              done
            done
          fi

          # CODEOWNERS money-path gate (gate script comes from the base branch checkout)
          if [ "$REQUIRE_GATE" = "true" ]; then
            [ -n "$GATE_SCRIPT" ] || skip "require_codeowners_gate without gate_script - fail closed"
            [ -f "$GATE_SCRIPT" ] || skip "gate script $GATE_SCRIPT missing on base branch - fail closed"
            co="$RUNNER_TEMP/codeowners-base"
            co_err="$RUNNER_TEMP/codeowners.err"
            if gh api "repos/$REPO/contents/.github/CODEOWNERS?ref=$BASE" --jq '.content // empty' > "$RUNNER_TEMP/co.b64" 2>"$co_err"; then
              base64 -d < "$RUNNER_TEMP/co.b64" > "$co" || skip "CODEOWNERS decode failed - fail closed"
            elif grep -qiE '404|Not Found' "$co_err"; then
              : > "$co" # no CODEOWNERS on base: nothing protected
            else
              cat "$co_err" >&2
              skip "CODEOWNERS fetch failed - fail closed"
            fi
            gate_rc=0
            CODEOWNERS_FILE="$co" bash "$GATE_SCRIPT" --files "${changed_files[@]}" || gate_rc=$?
            if [ "$gate_rc" -eq 0 ]; then
              skip "touches CODEOWNERS protected paths - human merge required"
            elif [ "$gate_rc" -ne 1 ]; then
              skip "gate script crashed (exit $gate_rc, not a verdict) - fail closed"
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "reason=eligible" >> "$GITHUB_OUTPUT"

  arm:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.skip == 'false'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require an elevated token before arming auto-merge
        id: token-gate
        env:
          MERGE_TOKEN: ${{ secrets.merge_token }}
        run: |
          set -euo pipefail
          if [ -z "$MERGE_TOKEN" ]; then
            echo "No merge_token secret. Arming with GITHUB_TOKEN would make"
            echo "github-actions[bot] the merging identity, and GitHub raises no"
            echo "workflow events for GITHUB_TOKEN actions -- the merge commit on"
            echo "main would run neither CI nor ship workflows. Skipping (loud no-op)."
            echo "::notice::auto-merge not armed: no merge_token secret (see workflow header)"
            echo "armed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "armed=true" >> "$GITHUB_OUTPUT"

      - name: Probe the merge token (presence is not validity - ST-4393)
        if: steps.token-gate.outputs.armed == 'true'
        env:
          GH_TOKEN: ${{ secrets.merge_token }}
        run: |
          set -euo pipefail
          out="$(gh api rate_limit 2>&1)" && { echo "merge token accepted."; exit 0; }
          if printf '%s' "$out" | grep -qiE '401|Bad credentials|403'; then
            echo "::error::merge token present but rejected by the API. Rotate it; auto-merge cannot arm."
            exit 1
          fi
          echo "::error::merge token probe failed unexpectedly: $(printf '%s' "$out" | head -1)"
          exit 1

      - name: Enable auto-merge (squash + delete branch)
        if: steps.token-gate.outputs.armed == 'true'
        env:
          GH_TOKEN: ${{ secrets.merge_token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DELETE_BRANCH: ${{ inputs.delete_branch }}
        run: |
          set -euo pipefail
          args=(--auto --squash)
          [ "$DELETE_BRANCH" = "true" ] && args+=(--delete-branch)
          echo "Enabling auto-merge (${args[*]}) for $PR_URL"
          out="$(gh pr merge "${args[@]}" "$PR_URL" 2>&1)" && { echo "auto_merge_command status=success"; exit 0; }
          echo "auto_merge_command status=failed code=outcome_unknown request_id=unavailable"
          if echo "$out" | grep -qiE 'delete-branch.*when merge queue enabled'; then
            # A merge queue refuses --delete-branch: the flag flips the repository's
            # delete-branch-on-merge setting, and a queue cannot have both.  The
            # queue's own "delete head branches" setting owns that job from there on,
            # so arm again without the flag instead of failing the step for every PR
            # in the repo (AFC-413).
            echo "::notice::the merge queue refuses --delete-branch; arming without it"
            out="$(gh pr merge --auto --squash "$PR_URL" 2>&1)" && { echo "auto_merge_command status=success"; exit 0; }
            echo "auto_merge_command status=failed code=outcome_unknown request_id=unavailable"
          fi
          if echo "$out" | grep -qiE 'already enabled|Auto merge is already'; then
            echo "Auto-merge already armed."; exit 0
          fi
          if echo "$out" | grep -qiE 'Pull request is in clean status'; then
            if gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest' | grep -vq null; then
              echo "Auto-merge armed (clean status)."; exit 0
            fi
            echo "::error::PR reports clean status but auto-merge is not armed - not treating as armed."
            exit 1
          fi
          if echo "$out" | grep -qiE 'is not mergeable|not mergeable|merge conflict|required status check|Review required'; then
            if gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest' | grep -vq null; then
              echo "Auto-merge armed despite pending checks."; exit 0
            fi
            echo "::notice::Auto-merge not armed: the PR is not ready"; exit 0
          fi
          echo "::error::Failed to enable auto-merge for $PR_URL"
          exit 1

  disarm:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.skip == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Disable any armed auto-merge (inline port of disable-pr-automerge.sh)
        env:
          MERGE_TOKEN: ${{ secrets.merge_token }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REASON: ${{ needs.classify.outputs.reason }}
        run: |
          set -euo pipefail
          echo "PR ineligible ($REASON); ensuring auto-merge is off for $PR_URL"
          read_state() { GH_TOKEN="$1" gh pr view "$PR_URL" --json autoMergeRequest --jq 'if .autoMergeRequest == null then "off" else "armed" end' 2>/dev/null || true; }
          check_state() {
            local s t
            for t in "$primary" "$fallback"; do
              [ -n "$t" ] || continue
              s="$(read_state "$t")"
              [ -n "$s" ] && { echo "$s"; return; }
            done
            echo unreadable
          }
          primary="${MERGE_TOKEN:-}"; fallback="${FALLBACK_TOKEN:-}"
          [ -n "$primary" ] || { primary="$fallback"; fallback=""; }
          state="$(check_state)"
          if [ "$state" = "off" ]; then echo "auto-merge already off."; exit 0; fi
          for token in "$primary" "$fallback"; do
            [ -n "$token" ] || continue
            if GH_TOKEN="$token" gh pr merge --disable-auto "$PR_URL"; then
              echo "auto-merge disabled."; exit 0
            fi
          done
          state="$(check_state)"
          case "$state" in
            off) echo "auto-merge disabled."; exit 0;;
            armed) echo "::error::auto-merge still armed for $PR_URL and every credential was rejected"; exit 1;;
            *) echo "::error::disable attempts failed and auto-merge state is unreadable for $PR_URL - failing closed"; exit 1;;
          esac
