name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    # Depth 2 keeps both parents of a pull request's merge commit, so the mirror check below can read the base
    # side (HEAD^1) without a second fetch.  Nothing else in the job reads history.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
    # No conflict markers anywhere in the tree.  A rebase can merge a file without
    # reporting a conflict and still leave the markers in it,  so the file does not parse
    # and the failure looks like a syntax error in whatever module imported it.
    #
    # The scan is tree-wide, so a marker in a repository-root config that no test reads
    # is caught too.  The exit status is checked separately, because a grep that could
    # not read the tree must fail the gate rather than pass it silently.  The `=======`
    # alternative is the separator git writes between the two halves of a conflict.
    - name: No conflict markers
      run: |
        # The substitution is in an `if` condition on purpose.  A standalone
        # assignment takes the status of the command it holds,  and grep exits 1 when
        # it finds nothing,  so under `bash -e` a CLEAN tree would abort the step
        # before any check ran.  In the `else` branch the status is available as $?.
        if out="$(grep -rlE '^(<<<<<<<|>>>>>>>|\|\|\|\|\|\||=======$)' \
          --exclude-dir=.git --exclude-dir=node_modules \
          --include='*.py' --include='*.sh' --include='*.yml' --include='*.yaml' \
          --include='*.json' --include='*.js' --include='*.cjs' --include='*.mjs' \
          --include='*.ts' . 2>&1)"; then
          echo "$out"
          echo "conflict markers found:  resolve them before merging"; exit 1
        else
          st=$?
          if [ "$st" -gt 1 ]; then
            echo "$out"
            echo "conflict-marker scan failed:  cannot read the tree"; exit 1
          fi
        fi
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'
    # A repeated mapping key still loads in a Hash-backed YAML parser, and GitHub's
    # workflow parser rejects it.  The file then registers under its path and every
    # push gets a red suite with zero jobs (AFC-529).  Ruby's Psych AST keeps both
    # keys, and Ruby is already on this runner, so the check adds no package.
    - name: Workflow YAML rejects duplicate keys
      # The suite bounds each checker call at 30 s and makes 8 of them, so the step
      # budget must exceed 8 x 30 s or a wedged checker is cancelled mid-suite.
      timeout-minutes: 6
      run: |
        timeout 60 ruby scripts/check-workflow-duplicate-keys.rb .github/workflows .github/pr-autofix-trusted.yml
        cd scripts && python3 -m unittest test_workflow_duplicate_keys -v
    # FLEET-PROTOCOL.md is generated from Fleet-OPS handbook/ and mirrored here by the sync job's pull request from
    # handbook-sync/mirror.  The mirror must start with the GENERATED header, its body must hash to the header, and
    # only that branch may change it.  To change policy, open a PR to Fleet-OPS handbook/ (its README has the rules).
    # `test` is a required status check on main (strict:  the branch must be up to date), so this step is a hard gate:
    # a red result blocks the merge of every pull request here, and a bug in the check or a bad state on main blocks
    # the whole repository.  Break-glass is an admin bypass (enforce_admins is false) or the sync job's own branch
    # handbook-sync/mirror with a valid header and hash.  The Mac sync job is the authenticity enforcer, because a
    # hash cannot tell a real build from a forged one.
    # It runs first, on the untouched checkout, because it compares the base with the working tree and a
    # later step that rewrote a tracked file would look like a change by the pull request.  A pull request is compared
    # with the first parent of its merge commit, which is exactly the base GitHub merged against;  a fork's branch is
    # tagged fork:, so it can never borrow the mirror branch name.  A push to main checks the header and hash only.
    # The branch and its repo arrive through env, never spliced into the script.
    - name: Generated mirror header, hash and author
      env:
        EVENT: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        THIS_REPO: ${{ github.repository }}
      run: |
        python3 scripts/test_check_generated_mirror.py
        if [ "$EVENT" = "pull_request" ]; then
          if git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
            base="$(git rev-parse 'HEAD^1')"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            base="$BASE_SHA"
          fi
          branch="$HEAD_REF"
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then branch="fork:$HEAD_REPO:$HEAD_REF"; fi
          python3 scripts/check-generated-mirror.py --base "$base" --head-branch "$branch"
        else
          python3 scripts/check-generated-mirror.py
        fi
    - name: Run unittests
      run: |
        cd scripts && python3 -m unittest discover fleet_rag/tests/ -v
    - name: Lane doctor and tmp guard tests
      run: |
        cd scripts && python3 -m unittest discover -s fleet_lanes/tests -t . -v
    # hold-guard (Kody r4373587808 on #964):  unit, integration (the shipped
    # shell against a fake gh) and workflow-static suites.  Unwired tests are
    # decoration:  regressions would ship under a green CI.  PyYAML is needed
    # by test_workflow_static.py.
    - name: hold-guard tests
      run: |
        pip install PyYAML
        cd scripts/hold-guard && python3 -m unittest discover -s . -t . -v
    # pr-sweep (docs/PR-SWEEP.md):  a fake gh, fake agents and a fake lane tool, so nothing reaches GitHub or runs
    # an agent;  includes the check that no adapter, skill or doc carries a copy of a rule from rules.md.
    - name: pr-sweep tests
      run: |
        cd scripts && python3 -m unittest discover -s pr_sweep/tests -t . -v
    # git-relay / GR-MCP:  seat-policy allowlists, constant-time auth, the one-bearer-one-bot
    # identity rule, fsynced audit rows (bodies hashed, never logged), the bounded GitHub
    # client and the HTTP surface.  Fakes only;  no network.
    - name: git-relay tests
      run: |
        python3 -m unittest discover -s git-relay/git_relay/tests -t git-relay -v
    - name: Code-only Coolify fleet CLI sync tests
      run: |
        python3 scripts/test_fleet_cli_release.py
        python3 scripts/test_fleet_cli_sync.py
        python3 scripts/test_fleet_cli_runtime.py
        bash -n scripts/agent-sync-runtime-sync.sh
    # fleet-server-status (AFC-548):  the server collector whose report the Muster
    # Server Status panel reads.  The drift against the previous report, the omission
    # of a measurement that could not be taken, the credential path filter and the
    # atomic private write.  Fakes only:  no docker, no network, no server.
    - name: fleet-server-status tests
      run: python3 scripts/test_fleet_server_status.py
    # The Lark bridge: the eyes marker, the Operator's signal path and the
    # durable write of a record.  No job ran this file, so every assertion in
    # it was decoration: the write could lose a record on a crash and CI would
    # stay green, exactly the way the cleanup lock contract stayed untested
    # until the Mac scripts job was added.  A step is what makes the test real.
    - name: Lark bridge tests
      # The suite raises SIGTERM into its own process to break a blocking
      # read, so a test that hangs would hold the job open with nothing to
      # report.  The step ends on its own after five minutes instead.
      timeout-minutes: 5
      run: cd scripts && python3 test-lark-mm-bridge.py
    # Keeps the docs/PR-AUTOFIX.md caller template's permissions and secrets
    # block in step with what the pr-autofix reusable declares and consumes.
    - name: Autofix caller template guard
      run: python3 scripts/test_pr_autofix_doc_template.py
    - name: simple-chat CLI tests
      run: |
        cd scripts && python3 -m unittest discover -s agent_sync/tests -t . -v
        python3 -m unittest discover -s whatsapp_bridge/tests -t . -v
    # Infisical knobs for the open-loops jobs:  fake-CLI fetch, last-known-good, secrets fail
    # closed, local files only narrow, and INFISICAL.md equal to the registry.
    - name: fleet_knobs tests
      run: |
        cd scripts && python3 -m unittest discover -s fleet_knobs/tests -t . -v
    # fleet_config (Muster Phase 2):  the desired-state manifest and its validators, the six L0 check
    # kinds, the L1 and L2 proof machinery, the aggregator's fail-closed verdict math, the plan and the
    # apply side, and the Touch ID gate.  Every test uses a temp home;  none touches the real Mac.
    - name: fleet_config tests
      run: |
        cd scripts && python3 -m unittest discover -s fleet_config/tests -t . -v
    # fleet_view (AFC-394):  the Fleet View collectors for lanes, open PRs and Linear claims, the
    # request budget, the blocker mapping and the pinned envelope.  Fake runners only;  no network.
    - name: fleet_view tests
      run: |
        cd scripts && python3 -m unittest discover -s fleet_view/tests -t . -v
    # fleet-secrets (OPS-818):  fake infisical and Keychain at subprocess.run;  get, run, --only, exit 3, the
    # unresolved-reference guard, auth selection, and no secret in argv or error text.
    - name: fleet_secrets tests
      run: |
        cd scripts && python3 -m unittest discover -s fleet_secrets/tests -t . -v
        bash -n install-fleet-secrets.sh
        bash -n fleet_secrets/seed-system-keychain.sh
        bash -n fleet_secrets/switch-pm2-jobs.sh
    # needs-owner (open-loops C6-1 and C6-2):  a fake `board` and `simple-chat` on PATH, built on the real parsers, a fixed
    # clock and fake K1 knobs for the fallback notifier;  the stable copy installed into a temp HOME must run under
    # `python3 -I`, and the LaunchAgent plist must parse.
    - name: needs-owner tests
      run: |
        cd scripts && python3 -m unittest discover -s needs_owner/tests -t . -v
    # Open-loops F6:  the fleet_facts gatherers and the single activity definition.  Fake gh, board and lane
    # programs on PATH and a temp HOME, so nothing live is read;  the install test runs the stable copy
    # with python3 -I.  The second step fails if the test data holds a real path, Linear id, UUID or secret.
    - name: fleet_facts tests
      run: |
        cd scripts && python3 -m unittest discover -s fleet_facts/tests -t . -v
    - name: fleet_facts fixtures are synthetic
      run: python3 scripts/fleet_facts/check_fixtures.py
    # Open-loops C2-1:  gather, render and send for the daily digest.  Scripted gatherers, a fake simple-chat that
    # runs every command line through the real simple-chat parser, and a temp HOME for the install test (which
    # runs the stable copy with python3 -I).  The second step uses the same synthetic-data check on these tests.
    - name: open_loops tests
      run: |
        cd scripts && python3 -m unittest discover -s open_loops/tests -t . -v
    - name: open_loops fixtures are synthetic
      run: python3 scripts/fleet_facts/check_fixtures.py --root scripts/open_loops/tests
    # Fleet tool parity doctor (docs/protocols/fleet-tool-parity.md).
    - name: Fleet tools doctor tests
      run: python3 scripts/test_fleet_tools_doctor.py
    # Zulip bot provisioning script (AFC-359):  runs against a fake Zulip on 127.0.0.1 and a fake fleet-secrets.
    - name: Zulip provision bots tests
      run: python3 scripts/test_zulip_provision_bots.py
    # MiniMax Code guard live proof (AFC-365):  the tool that separates the matcher, the
    # policy and the live dispatch, so an installed-but-never-fired guard cannot read as
    # protected.  The test builds a temporary plugin directory and a fake hook command, so
    # it starts no MiniMax session and reads no installed plugin.
    - name: Muster install transaction tests
      run: python3 -m unittest discover -s muster/script -t muster/script -v
    - name: Muster guard live proof tests
      run: python3 scripts/test_muster_guard_live_proof.py
    # Fleet skills pack: canonical pin-or-fail identity block, every rendered
    # tree equal to a fresh render, and the FLEET-PROTOCOL roster the pack mirrors.
    - name: Fleet skill identity tests
      run: |
        cd scripts && python3 -m unittest test_fleet_skill_identity -v
    # The sentence-gap converter, read from the one home:  its shape (one or more
    # spaces, the numbered-list lookbehind, the markup group) and its behaviour on
    # every shape a body can hold, plus the check that no copy has drifted.
    - name: Sentence gap converter tests
      run: |
        cd scripts && python3 -m unittest test_sentence_gap_converter -v
    # The code-aware sentence-gap program:  every surface embeds the same program,
    # the program carries the one home's pattern, the code comes back byte for byte,
    # the gaps are made, the prose runs collapse, and the program is idempotent --
    # the check that sees a prose double space no grep over the body can see.
    - name: Sentence gap program tests
      run: |
        cd scripts && python3 -m unittest test_sentence_gap_program -v
    # The FINAL owner sentence-gap policy (AFC-521):  every file that states the
    # rule names the exceptions (the Claude Code Code tab and the MiniMax Code chat
    # pane take the entity, and an Apple Note body takes the narrow no-break space),
    # no live line prescribes the superseded 2026-10-22
    # GitHub-entity split, and the published note takes a real U+00A0 on GitHub too.
    - name: Sentence gap final policy tests
      run: |
        cd scripts && python3 -m unittest test_sentence_gap_final_policy -v
    # The App Store sheet's sentence-gap rule (CPY-1) must agree with the canonical
    # rule:  the same mechanism, the same two chat-pane exceptions and the same
    # Apple Notes exception.  The requirements are read from the canonical skill, so
    # the sheet rule cannot drift away from the one home of the rule.
    - name: Sheet rule sentence gap tests
      run: |
        cd scripts && python3 -m unittest test_sheet_rules_sentence_gap -v
    # AFC-478 follow-up:  the Muster reader of the Worker's Linear token health
    # (signature scheme, document shape, atomic 0600 write).
    - name: Worker health reader tests
      run: |
        cd scripts && python3 -m unittest test_fleet_worker_health -v
    # The MiniMax model id the autofix bots dispatch: the trusted policy, every
    # reusable workflow default, and the reference doc all name one id, and a
    # retired spelling may appear in a comment but never as a value.
    - name: Autofix model default tests
      run: |
        cd scripts && python3 -m unittest test_autofix_model_defaults -v
    # Owner rule 2026-10-21:  the request gate fires only on a tag that opens
    # the comment.  The test runs the reusables' own marked gate block.
    - name: Autofix request gate tests
      run: |
        cd scripts && python3 -m unittest test_autofix_request_gate -v
    # Owner seat-precedence rule (FLEET-PROTOCOL Identity Rules, 2026-10-09):  no
    # rendered skill may export a platform seat over a launcher's, write the
    # launcher variables, or lack the launcher clause.
    - name: Seat blocks in the rendered skill trees
      run: python3 scripts/check-seat-blocks.py
    # The open-loops routine texts are private (kept in the canonical private repository) and never enter this
    # repo.  Only their checker and its synthetic fixtures do:  the good set must pass, and each bad
    # fixture must fail on exactly its own rule (docs/open-loops/README.md).
    - name: Routine prompt checker
      run: |
        python3 scripts/test_check_routine_prompts.py
        python3 scripts/check-routine-prompts.py scripts/tests/fixtures/routines/good
    # Mac watch and Grok idle-unload logic.  Both suites build their own temp
    # HOME and fixture sessions, so they read no live state and kill nothing.
    - name: Mac watch and Grok idle-unload tests
      run: |
        python3 scripts/test_grok_idle_unload.py
        python3 scripts/test_mac_process_watch_shellular.py
    # Simulator idle reaper and the Claude turn-end hook:  fake device.plist files and a
    # temp state dir;  xcrun, simctl and pgrep are patched, so nothing is booted or shut down.
    - name: Simulator idle reaper tests
      run: python3 scripts/test_sim_idle_reaper.py
    # Zulip linkifiers:  TARGET's patterns against every CHECKS string under Zulip's match
    # boundaries, and the plan and reorder logic.  No network.
    - name: Zulip linkifier tests
      run: cd scripts && python3 -m unittest test_zulip_linkifiers -v
    # The Google Drive backup:  the File Provider-safe copy, the rule that a refused subtree is
    # reported rather than raised, and the retention that drops the dated backup folders beyond
    # the newest N.  Temp directories only, so nothing in Drive is read or written.
    - name: Google Drive backup tests
      run: python3 scripts/test_sync_fleet_agent_config.py -v
    # Fleet work backup (restic to B2):  temp repos and a temp home, stub restic and gitleaks, git
    # with no user config.  Nothing is uploaded and no real path is read.
    # restic is installed so the init, backup, check and restore round trip runs for real against a
    # local repository (the test skips itself where restic is missing).
    - name: Install restic
      run: sudo apt-get update -qq && sudo apt-get install -y -qq restic
    - name: Fleet work backup tests
      run: python3 scripts/fleet-work-backup/test_fleet_work_backup.py
    - name: Verify public activity boundary
      run: python3 scripts/test-public-activity.py
    - name: Verify fleet registry
      run: python3 scripts/check-fleet-registry.py
    # The registry's FLEET-PROTOCOL.md rows are read under the GENERATED header, which itself names Fleet-OPS.
    - name: Registry checks read FLEET-PROTOCOL.md under its header
      run: python3 scripts/test_check_fleet_registry.py
    # check-ci-runner-policy.py must recognize FLEET-PROTOCOL's local-Mac-runner ban wording.
    - name: CI runner policy lint tracks FLEET-PROTOCOL ban text
      run: python3 scripts/test_check_ci_runner_policy.py
    # GROK-BUILD in any spelling is an alias for GROK (owner 2026-10-10).  The standalone runtimes (the
    # Linear board, recall) carry a copy of the registry's aliasPattern;  these fail when a copy drifts.
    - name: Seat alias parity (linear-board)
      run: python3 scripts/linear-board/test_board.py SeatAliasTests
    # AFC-361:  board writes, notes_create/notes_update and apple-notes-coding.sh carry a session id and refuse
    # without one (single-thread seats exempt).  The parity test keeps every copy of fleet-apps.json
    # `sessionIds` equal;  the other two run the board verbs against the mock Linear and the notes script with
    # APPLE_NOTES_PRINT_HTML=1, which never touches Notes.
    - name: Session id contract (AFC-361)
      run: |
        cd scripts && python3 -m unittest test_session_ids_parity test_apple_notes_session
        cd .. && python3 scripts/linear-board/test_board.py SessionIdTests
    # AFC-431:  the pin Shortcut must be retried once, so a timing race does not leave a coding note
    # unpinned, and a failed run must not be reported as a missing Shortcut.  The test drives the real
    # pin block out of the script with a stub `shortcuts` on PATH, so it touches no Notes and runs here.
    - name: Notes pin decision (AFC-431)
      run: |
        cd scripts && python3 -m unittest test_apple_notes_pin
    # AFC-436:  the canonical helper must carry the 900 s AppleEvent timeout around its Notes calls.
    # The fix existed only in the live copy at ~/apps/apple-notes-coding.sh,  so the repository copy
    # lost it and an install from the repository would have dropped it again.  These tests read the
    # script as text, so they touch no Notes and run here.
    - name: Notes AppleEvent timeout (AFC-436)
      run: |
        cd scripts && python3 -m unittest test_apple_notes_timeout
    # AFC-486:  the helper's --read, --list and --existing-only modes and its action log.  A stub osascript on
    # PATH stands in for Notes, so the tests touch no Notes and run here.
    - name: Notes read, list and action log (AFC-486)
      run: |
        cd scripts && python3 -m unittest test_apple_notes_actions
    # AFC-547:  the helper turns a bare project or pull request reference into a link, the way the writer
    # would write it by hand.  The same stubs stand in for Notes and the preview hook prints the HTML the
    # note would get, so the assertions read the links and nothing touches Notes.  Each test runs the
    # script once, and the script starts python a few times per run, so the step gets a budget of its own.
    - name: Notes linkifier (AFC-547)
      timeout-minutes: 10
      run: |
        cd scripts && python3 -m unittest test_apple_notes_linkify
    # The open-loops tools (needs-owner, ask-capture, claim expiry, lane sweep) file and comment through
    # `board` with the text in a 0600 file, never in argv, and set flat labels that only a fixed
    # allow-list may name.  These two classes (about a minute) pin that contract; the full suite is
    # slower and stays a local run.  TokenBlobTests (about 8 seconds) pins the per-key fleet-secrets reads and the
    # zero-mint, zero-write fresh-blob path (AFC-361).  CommentAuthorTests pins the comment account fields (author_id, author_app) that the
    # needs-owner notifier checks the owner's Linear reply by.
    # CredentialPreviewTests and CredentialFailureTests pin what the board says about a credential it
    # could not use:  a masked preview of the credential rather than the credential, and the name of
    # the variable to fix on every exit-4 line (AFC-473).
    - name: Board CLI input files and flat labels
      run: python3 scripts/linear-board/test_board.py FileInputTests FlatLabelTests CommentAuthorTests TokenBlobTests CredentialPreviewTests CredentialFailureTests
    # Infisical for the board CLI (AFC-348):  client pairs from /linear before local files, the shared
    # LINEAR_<SEAT>_CACHE_TOKEN adopted and published, and the fallback when Infisical is down.  Mock servers only.
    - name: Board CLI Infisical tests
      run: python3 scripts/linear-board/test_board_infisical.py
    # Agent-Sync parity (AFC-329):  `board commands|run|api|mcp` serve the hosted server's Linear catalogs from
    # scripts/linear-board/catalog/ (pinned to the server's export by the agent-sync-mcp node test
    # linear-catalog-parity).  This replays the server's documents and guard verdicts against board's Python
    # ports, checks board lists exactly the exported names, and runs the verbs against a mock Linear and a fake
    # official MCP server (about a minute).
    - name: Board CLI Agent-Sync parity
      run: python3 scripts/linear-board/test_board_parity.py
    # Infisical's only environment is prod (owner 2026-10-10).  The lint fails on a dev or
    # staging INFISICAL_ENV in an env file or cursor-cloud-start.sh fallback, and on a
    # non-prod .infisical.json default;  `--fleet` runs it over every ~/Code repo on origin/main.
    - name: Infisical environment lint (prod only)
      run: |
        python3 scripts/test_check_infisical_env.py
        python3 scripts/check-infisical-env.py
    # fleet-telemetry-relay: transform mappings against recorded payloads,
    # secretscan redaction parity, Coolify env-name inventory, and a stubbed
    # configure-agents.sh (never talks to Infisical or writes under $HOME).
    - name: fleet-telemetry-relay tests
      run: |
        cd telemetry-relay && PYTHONPATH=tests python3 -m unittest discover -s tests -t tests -v
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'
    - name: Verify operator start routing
      run: node --test scripts/safari-start/worker.test.mjs
    # Shared alert ingress: state transitions, vendor normalization, and the
    # Zulip status rendering.  Pure functions, so no Workers runtime needed.
    # The test files are named explicitly: on Node 24 the directory form
    # (`node --test workers/alert-ingress/src/`) resolves src/index.js as a
    # single module and reports one passing test without running any test
    # file, which left this gate vacuous.
    - name: Alert ingress unit tests
      run: node --test workers/alert-ingress/src/*.test.js
    # Hosted ST-MCP Worker unit tests (including GraphQL document
    # parsing).  Install its pinned dependencies before running the suites.
    - name: ST-MCP Worker unit tests
      run: |
        npm ci --ignore-scripts --prefix scripts/agent-sync-mcp
        node --test scripts/agent-sync-mcp/test/*.test.mjs
    # The scoped-folder copy script (AFC-478) against a mocked Infisical and a fake
    # fleet-secrets:  names-only output, collisions, exit codes and reruns.
    - name: ST-MCP scoped-folder copy script tests
      run: python3 -I scripts/agent-sync-mcp/scripts/test_populate_scoped_folders.py
    - name: Kody defer and deferred sweep tests
      run: node --test scripts/kody-defer/*.test.mjs scripts/kody-deferred-sweep.test.mjs
    - name: Autofix dispatcher tests
      run: node --test scripts/autofix-dispatcher/*.test.mjs
    # The pr-sweep Claude adapter (a Workflow script) against stubbed workflow hooks:  a mismatched or missing status,
    # or a copy that fails its check line, stops it before any worker;  repairs and deploys go only where they belong.
    - name: pr-sweep Claude adapter test
      run: node --test scripts/pr_sweep/tests/claude_adapter.test.mjs
    - name: PR Autofix reusable workflow contract
      run: node --test .github/pr-autofix-reusable.node-test.mjs
    # The shared auto-merge armer against a fake `gh`:  a merge queue refuses
    # --delete-branch, and the armer has to arm again without the flag instead of
    # failing every PR in the repo (AFC-413).  No network:  the fake records its
    # arguments and answers what the test tells it to.
    - name: Auto-merge reusable workflow contract
      run: python3 scripts/test_auto_merge_reusable.py
    # Pure builders and readers of the Fleet Reference Sheet registry sync.  No
    # network:  the tests import the script, which runs main() only as an entry point.
    - name: Fleet Reference Sheet registry sync tests
      run: node --test scripts/fleet-apps-sheet-sync.format.test.mjs scripts/fleet-apps-sheet-sync.tabs.test.mjs scripts/fleet-apps-sheet-sync.ingest.test.mjs
    # The TestFlight freshness deploy check (AFC-341).  App Store Connect, gh, build-window.sh,
    # the state file and Zulip are stubbed;  the last test validates testflight-apps.json.
    - name: TestFlight freshness check tests
      run: |
        node --test scripts/ios-fleet/ios_testflight_freshness.test.mjs
        bash -n scripts/ios-fleet/install-testflight-freshness.sh
    # The fleet iOS version manifest publisher (AFC-540).  It publishes as a
    # branch plus a pull request against this repository, because the ruleset
    # refuses a direct write to main.  The tests assert the merge keeps every
    # sibling app, that the publish never names the default branch, and that
    # the workflow's own read-only GITHUB_TOKEN is refused.
    - name: Fleet iOS version manifest publisher tests
      run: |
        node --test scripts/ios-fleet/publish-ios-versions.test.mjs
        bash -n scripts/ios-fleet/publish-ios-versions.sh
    - name: Mac ledger mirror tests
      run: bash scripts/test-mac-ledger-mirror.sh
    # The cutover helper for retiring ~/.secrets (AFC-359):  a temp HOME, stub launchctl and lsof, a throwaway repo.
    - name: Retire secrets dir tests
      run: bash scripts/test-retire-secrets-dir.sh
    # The BotFleet launch wrapper and its LaunchAgent template:  the "already healthy" exit, the
    # missing-checkout exits, and the fleet-seat switch (BOTFLEET_FLEET_SEAT_PROMPTS=1) that the
    # open-loops routines depend on.  A stub curl and a stub node stand in for the real ones.
    - name: BotFleet start wrapper tests
      run: bash scripts/test-botfleet-server-start.sh
    # The resource watcher that runs on this Mac every 5 minutes:  the live
    # thresholds it must carry, and the shared housekeeper lock it must take so
    # two schedulers never reclaim at once.  Static checks plus the module's own
    # evaluate();  nothing here reads the host or sends a webhook.
    - name: Mac resource watch tests
      run: bash scripts/test-mac-resource-watch.sh

  mac-scripts:
    name: Mac scripts
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    # The maintenance scripts that run on Jay's Mac, and their contracts.
    # They have to run on macOS: the scripts use BSD stat and BSD find, and
    # the tests assert on the inode of the lock directory, which is what tells
    # a live peer's lock apart from one this process created.  The Ubuntu test
    # job cannot run them, so this job is where they actually run -- before
    # this one existed the cleanup lock contract was never exercised in CI at
    # all, and its assertions were decoration.
    - name: Mac cleanup script tests
      run: bash scripts/test-mac-auto-cleanup.sh
    - name: Mac resource watch tests
      run: bash scripts/test-mac-resource-watch.sh

  muster-macos-build:
    name: Muster macOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate and compile unsigned scaffold
        working-directory: muster
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -project Muster.xcodeproj -scheme Muster -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath .build/CI \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build
      - name: Run the Muster unit tests
        working-directory: muster
        run: |
          xcodebuild -project Muster.xcodeproj -scheme Muster -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath .build/CITest \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= test
