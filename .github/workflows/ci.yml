name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Run unittests
      run: |
        cd scripts && python3 -m unittest discover fleet_rag/tests/ -v
    - name: Lane doctor and tmp guard tests
      run: |
        cd scripts && python3 -m unittest discover -s fleet_lanes/tests -t . -v
    - name: Verify public activity boundary
      run: python3 scripts/test-public-activity.py
    # The admin panel inlines its own copy of the app registry because the Worker
    # has no filesystem.  Nothing compared the two, so a renamed repo silently
    # turned its GitHub card row red (Socratic.Trade -> Socratic-Trade, a 301 the
    # Worker will not follow).  This now fails the build instead.
    - name: Verify fleet registry (incl. admin-panel APPS copy)
      run: python3 scripts/check-fleet-registry.py
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'
    - name: Verify operator start routing
      run: node --test scripts/safari-start/worker.test.mjs
    - name: Verify operator dashboard deployment boundary
      run: node --test tests/deployment-boundary.test.cjs
    - name: Kody defer and deferred sweep tests
      run: node --test scripts/kody-defer/*.test.mjs scripts/kody-deferred-sweep.test.mjs
    - name: Mac ledger mirror tests
      run: bash scripts/test-mac-ledger-mirror.sh
