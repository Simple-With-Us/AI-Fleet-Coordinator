name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run unittests
      run: |
        cd scripts && python3 -m unittest discover fleet_rag/tests/ -v
    - name: Verify public activity boundary
      run: python3 scripts/test-public-activity.py
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Verify operator start routing
      run: node --test scripts/safari-start/worker.test.mjs
