name: Visual verification

on:
  pull_request:
    branches: ["main"]
    paths:
      - "site/**"
      - "scripts/safari-start/**"
      - "visual-tests/**"
      - ".github/workflows/visual.yml"
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: visual-tests/package-lock.json
      - name: Install dependencies
        working-directory: visual-tests
        run: npm ci
      - name: Install Noto fonts (match baseline host rendering)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core
      - name: Install Playwright Chromium
        working-directory: visual-tests
        run: npx playwright install --with-deps chromium
      - name: Run smoke + visual specs
        working-directory: visual-tests
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          # test-results holds the actual/diff PNGs of a failed screenshot
          # assertion, which is how a baseline is refreshed from the exact CI
          # rendering.
          path: |
            visual-tests/playwright-report
            visual-tests/test-results
