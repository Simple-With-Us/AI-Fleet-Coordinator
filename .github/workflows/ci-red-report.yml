name: CI red streak report

# AFC-737 / AFC-750: daily read-only scan of default-branch workflow failure streaks.
# Token: repository secret FLEET_READ_TOKEN when set, else github.token.  With
# FLEET_READ_TOKEN the job scans every fleet-apps.json repo; otherwise only this repo.

on:
  schedule:
    - cron: "35 6 * * *"
  workflow_dispatch:
  # GitHub only registers workflow_dispatch against the default branch; on a PR
  # branch this path trigger runs the same job so the artifact can be verified
  # before merge (AFC-737).
  pull_request:
    paths:
      - ".github/workflows/ci-red-report.yml"
      - "scripts/ci-red-report/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-red-report-${{ github.repository }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run CI red report
        env:
          # Pull request runs execute PR code, so they never receive the org-wide token.
          FLEET_READ_TOKEN: ${{ github.event_name != 'pull_request' && secrets.FLEET_READ_TOKEN || '' }}
          GITHUB_TOKEN: ${{ github.event_name != 'pull_request' && secrets.FLEET_READ_TOKEN || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARGS=(--org Simple-With-Us --json-out ci-red-report.json --markdown-out ci-red-report.md)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ARGS+=(--repo "$REPO_NAME" --visibility-note "Pull request verification is intentionally limited to $REPO_SLUG.")
          elif [ -n "${FLEET_READ_TOKEN:-}" ]; then
            ARGS+=(--fleet-apps fleet-apps.json)
          else
            NOTE=$(python3 -c "import os, sys; sys.path.insert(0,'scripts/ci-red-report'); import fleet_apps; print(fleet_apps.missing_fleet_token_visibility_note(scanning_repo=os.environ['REPO_SLUG']))")
            ARGS+=(--repo "$REPO_NAME" --visibility-note "$NOTE")
          fi
          python3 scripts/ci-red-report/__main__.py "${ARGS[@]}"

      - name: Job summary
        run: |
          {
            echo "## CI red streak report"
            echo ""
            cat ci-red-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ci-red-report-${{ github.run_id }}
          path: |
            ci-red-report.json
            ci-red-report.md
          if-no-files-found: error
