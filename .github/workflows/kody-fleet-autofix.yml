# Enabled fleet wide by the owner on 2026-10-11 (boards 04b963b7 and 99e559ea).
# MiniMax M3.1 Flash via its direct OpenAI-compatible endpoint, paid; at most 5 attempts per UTC day in this repository.
name: Kody MiniMax M3.1 Flash Fix Proposals

# Generated offline.  Missing SWU_KODY_AUTOFIX_ENABLED means disabled.
# MODEL_API_KEY is forwarded explicitly; secrets are never inherited.
# The canonical reusable takes the provider key only from this forward.  It has no
# Infisical fallback:  a caller that cannot supply MODEL_API_KEY fails closed with a
# named error instead of resolving a key outside the approved secret path.
# Budget approval and protected-environment setup are separate owner actions.
# Daily attempt slots bound this repository only; they are not a dollar cap.
on:
  check_run:
    types: [completed]

permissions: {}
# Shared with the fleet's other PR autofix callers so only one autofix runs per PR.
concurrency:
  group: pr-autofix-${{ github.repository }}-${{ github.event.check_run.pull_requests[0].number || github.event.check_run.id }}
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      vars.SWU_KODY_AUTOFIX_ENABLED == 'true' &&
      github.event_name == 'check_run' && github.event.action == 'completed' &&
      github.run_attempt == 1 &&
      github.event.check_run.app.id == 413034 &&
      github.event.sender.type == 'Bot' && github.event.sender.id == 148880201 &&
      github.event.sender.login == 'kody-ai[bot]' &&
      github.event.check_run.conclusion == 'success' &&
      github.event.check_run.pull_requests[0].number != null &&
      github.event.check_run.pull_requests[1] == null
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
    # The canonical copy of this reusable lives in this repository,  so this caller
    # runs the same file the fleet's model-default test covers.  Pointing at another
    # repository's copy is how the two drift apart unnoticed.  The SHA is the commit
    # that carries the canonical copy;  it stays on this repository's main through
    # the merge commit,  so the pin does not need to move.
    uses: Simple-With-Us/AI-Fleet-Coordinator/.github/workflows/kody-autofix-reusable.yml@76e27db8821e2bfdd87aebb92daf3dce6f401d30
    with:
      repository_id: '1315501725'
      profile: 'python'
      source_prefixes: '["scripts/"]'
      daily_attempt_limit: 5
      budget_policy_id: 'approved-owner-2026-10-11'
      model: 'MiniMax-M3.1-Flash'
      model_base_url: 'https://api.minimax.io/v1'
    secrets:
      MODEL_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      USAGE_INGEST_TOKEN: ${{ secrets.USAGE_INGEST_TOKEN }}
