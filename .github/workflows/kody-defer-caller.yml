name: Kody defer

# Dogfood caller for this repo.  Copy github-workflows-template/workflows/kody-defer.yml
# into another repo to use the same flow.

on:
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  defer:
    if: contains(github.event.comment.body, '/defer')
    uses: ./.github/workflows/kody-defer.yml
    with:
      blocked-severities: critical
      # Use this PR head so dogfood works before the scripts land on main.
      tooling-ref: ${{ github.event.pull_request.head.sha }}
