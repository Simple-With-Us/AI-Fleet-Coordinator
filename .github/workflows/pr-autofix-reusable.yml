name: PR Autofix Reusable

# The fleet's shared PR autofix.  When a review bot comments on an open pull request, ask Claude
# Code (through the MiniMax Anthropic endpoint) to make the smallest change that answers it, and
# push that change to the PR branch.  Callers live in each repo as a thin workflow that triggers on
# the comment events and calls this file with `uses:`;  see docs/PR-AUTOFIX.md for the caller.
#
# Origin:  BotFleet's inline .github/workflows/autofix.yml, which replaced urcades/pr-autofix.
# That action is pinned at its newest commit and could never get past its guard step:  it counts
# earlier autofix commits with `grep -c ... || echo "0"`, and when there are none `grep -c` prints
# 0 and exits 1, so the fallback prints a second 0.  The value became "0\n0", the second 0 landed
# on a line of $GITHUB_OUTPUT that is not name=value, and the runner stopped with "Invalid format
# '0'" on every run.  The same action also checked out the PR branch without asking whether the PR
# was still open, so a late bot comment on a merged PR (whose branch is gone) failed at
# `git checkout`.  Forking it is not allowed here, so its steps live in this file, written so a
# comment can never reach $GITHUB_OUTPUT or an environment variable.
#
# The steps are inline on purpose.  A script in the calling repository would be read from whichever
# PR branch is checked out, and an older branch does not have it.
#
# The event context in a reusable workflow is the caller's, so github.event.* below is the comment
# event that started the caller.

on:
  workflow_call:
    inputs:
      allowed_bots:
        description: >-
          Comma-separated logins of the bots whose comments may start a run.  The
          default-branch .github/pr-autofix-trusted.yml allowed_bots list, when it has one,
          replaces this.  A PR branch's own .autofix.yml list may only narrow the trusted
          list, never widen it.
        type: string
        default: "kody-ai[bot],chatgpt-codex-connector[bot],cursor[bot],claude[bot],swu-ag[bot],swu-bf-builder[bot],swu-bf-compiler[bot],swu-bf-deployer[bot],swu-bf-designer[bot],swu-bf-director[bot],swu-bf-fixer[bot],swu-bf-housekeeper[bot],swu-bf-monitor[bot],swu-bf-oracle[bot],swu-bf-plumber[bot],swu-bf-publisher[bot],swu-claude[bot],swu-clutch[bot],swu-codex[bot],swu-cursor[bot],swu-cursor-cloud[bot],swu-echo[bot],swu-fx[bot],swu-gb-compiler[bot],swu-gb-deployer[bot],swu-gb-designer[bot],swu-gb-director[bot],swu-gb-engineer[bot],swu-gb-fixer[bot],swu-gb-housekeeper[bot],swu-gb-monitor[bot],swu-gb-oracle[bot],swu-gb-plumber[bot],swu-gb-publisher[bot],swu-gb-trader[bot],swu-grok-build[bot],swu-grok-web[bot],swu-jet[bot],swu-mc[bot],swu-minimax[bot],swu-opencode[bot],swu-operator[bot],swu-rob[bot],swu-wise[bot]"
      max_iterations:
        description: Most autofix commits allowed on one PR (trusted default-branch policy only).
        type: number
        default: 5
      claude_code_version:
        description: Version of @anthropic-ai/claude-code to install.
        type: string
        default: "2.1.295"
      # The id the owner chose for all fleet MiniMax use on 2026-10-20.  A model id that is
      # absent from the MiniMax Code runtime catalog can still be a valid public API id, and an
      # id must never be rewritten from one route's evidence; the fleet recall contribution
      # contrib/MM/2026-10-19/f11f7046 records that lesson, and it is a recall id rather than
      # a path in this repository.  The retired spelling is named here in a comment and never
      # as a value.
      model:
        description: >-
          MiniMax model id for ANTHROPIC_MODEL.  Overridden by .github/pr-autofix-trusted.yml on the
          default branch when that file sets model.
        type: string
        default: "MiniMax-M3.1-Flash"
      max_turns:
        description: >-
          Claude Code turn budget.  Overridden by .github/pr-autofix-trusted.yml on the default
          branch when that file sets max_turns.
        type: number
        default: 60
      verify_command:
        description: >-
          Optional shell to run after the model edits and before push.  When empty, the trusted file
          on the default branch may supply verify_command instead.
        type: string
        default: ""
    secrets:
      MINIMAX_API_KEY:
        required: true
      # Org secret (org settings > Secrets and variables > Actions).  Used only when
      # SWU_AUTOFIX_MODEL_BASE_URL points at api.meta.ai;  callers pass it through.
      META_MODEL_API_TOKEN:
        required: false
      AUTOFIX_GITHUB_APP_PRIVATE_KEY:
        required: false
        description: >-
          GitHub App private key whose installation pushes re-trigger CI.  Pair with the org/repo
          variable SWU_AUTOFIX_GITHUB_APP_ID.
      USAGE_INGEST_TOKEN:
        required: false
        description: >-
          Usage Monitor ingest token scoped to the ci-autofix producer.  Optional:  when it is absent
          the usage report is skipped and the run is unchanged.

jobs:
  autofix:
    # Same guards as the caller, repeated here so a caller that forgets them cannot spend a run on a
    # closed PR or a human comment.
    if: >
      (github.event.issue.pull_request || github.event.pull_request) &&
      (github.event.issue.state == 'open' || github.event.pull_request.state == 'open') &&
      (
        (github.event_name == 'pull_request_review' && contains(fromJSON('["bot", "Bot"]'), github.event.review.user.type)) ||
        (github.event_name != 'pull_request_review' && contains(fromJSON('["bot", "Bot"]'), github.event.comment.user.type))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      model: ${{ steps.trusted.outputs.model }}
    # No job-level concurrency here.  Every caller holds pr-autofix-<repo>-<pr> at workflow level,
    # and a job that asks for the group its own run already holds is cancelled before any step:
    # "Canceling since a deadlock was detected for concurrency group ... between a top level
    # workflow and 'autofix / autofix'" (BotFleet run 39054950194).  That stopped every run from
    # 2e671004 (#520) on.  The caller's group is what serializes the fleet's autofix writers.
    permissions:
      contents: write
      pull-requests: read
      # Marker comments record which bot already used its one run on a PR.
      issues: write
    env:
      # Owner switch 2026-10-21:  org/repo Actions variables SWU_AUTOFIX_MODEL and
      # SWU_AUTOFIX_MODEL_BASE_URL retarget every caller at once;  unset,  the MiniMax
      # pins below are exactly what ran before.  The key follows the host:  Meta's API
      # takes META_MODEL_API_TOKEN,  everything else takes MINIMAX_API_KEY.
      ANTHROPIC_BASE_URL: ${{ vars.SWU_AUTOFIX_MODEL_BASE_URL == 'https://api.meta.ai' && 'https://api.meta.ai' || 'https://api.minimax.io/anthropic' }}
      ANTHROPIC_AUTH_TOKEN: ${{ vars.SWU_AUTOFIX_MODEL_BASE_URL == 'https://api.meta.ai' && (secrets.META_MODEL_API_TOKEN || 'MISSING-META-MODEL-API-TOKEN') || secrets.MINIMAX_API_KEY }}
      VAR_MODEL: ${{ vars.SWU_AUTOFIX_MODEL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      INPUT_ALLOWED_BOTS: ${{ inputs.allowed_bots }}
      DEFAULT_MAX_ITERATIONS: ${{ inputs.max_iterations }}
      INPUT_MODEL: ${{ inputs.model }}
      INPUT_MAX_TURNS: ${{ inputs.max_turns }}
      INPUT_VERIFY_COMMAND: ${{ inputs.verify_command }}
    steps:
      - name: Resolve The Pull Request
        id: pr
        run: |
          set -euo pipefail
          # An issue_comment event carries no head ref, and the PR can have merged or closed since
          # the event fired, so ask for its current state.
          info=$(gh pr view "$PR_NUMBER" --json state,headRefName,isCrossRepository,headRefOid)
          state=$(jq -r '.state' <<< "$info")
          cross=$(jq -r '.isCrossRepository' <<< "$info")
          branch=$(jq -r '.headRefName' <<< "$info")
          head_sha=$(jq -r '.headRefOid' <<< "$info")
          # The handbook sync job owns this branch and refuses to refresh a pull request whose head it did
          # not push, so no autofix may commit to it (AFC-402).
          if [ "$branch" = "handbook-sync/mirror" ]; then
            echo "::notice::PR #$PR_NUMBER is the handbook mirror branch, which the handbook sync job owns"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$state" != "OPEN" ] || [ "$cross" = "true" ]; then
            echo "::notice::PR #$PR_NUMBER is $state (from a fork: $cross), so there is nothing to push to"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "proceed=true"
            echo "branch=$branch"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Model Switch
        if: steps.pr.outputs.proceed == 'true'
        env:
          VAR_BASE: ${{ vars.SWU_AUTOFIX_MODEL_BASE_URL }}
          VAR_MODEL: ${{ vars.SWU_AUTOFIX_MODEL }}
          META_TOKEN: ${{ secrets.META_MODEL_API_TOKEN }}
        run: |
          set -euo pipefail
          # The switch is all-or-nothing on the endpoint:  an unset base or the canonical
          # MiniMax host keeps the MiniMax route (VAR_MODEL may still rotate the MiniMax
          # model id),  and the only allowed non-MiniMax base is exactly
          # https://api.meta.ai,  which requires a non-MiniMax model id and a provisioned
          # META_MODEL_API_TOKEN. Values are never echoed into the workflow command:
          # caller-controlled text there can inject runner commands (Kody 2026-10-21).
          route=
          case "$VAR_BASE" in
            "" | https://api.minimax.io/anthropic) route=minimax ;;
            https://api.meta.ai) route=meta ;;
          esac
          model_minimax=no
          case "$VAR_MODEL" in [Mm][Ii][Nn][Ii][Mm][Aa][Xx]*) model_minimax=yes ;; esac
          if [ "$route" = "minimax" ]; then
            if [ -n "$VAR_MODEL" ] && [ "$model_minimax" = "no" ]; then
              echo "::error::SWU_AUTOFIX_MODEL names a non-MiniMax model id while SWU_AUTOFIX_MODEL_BASE_URL selects the MiniMax host;  use a MiniMax-* id or switch the base to https://api.meta.ai"
              exit 1
            fi
            exit 0
          fi
          if [ "$route" = "meta" ] && [ -n "$VAR_MODEL" ] && [ -n "$META_TOKEN" ] && [ "$model_minimax" = "no" ]; then exit 0; fi
          echo "::error::SWU_AUTOFIX_MODEL_BASE_URL must be unset or https://api.minimax.io/anthropic (MiniMax) or exactly https://api.meta.ai with a non-MiniMax SWU_AUTOFIX_MODEL and META_MODEL_API_TOKEN provisioned;  got base_set=$([ -n "$VAR_BASE" ] && echo yes || echo no) model_set=$([ -n "$VAR_MODEL" ] && echo yes || echo no) token_set=$([ -n "$META_TOKEN" ] && echo yes || echo no)"
          exit 1

      - name: Load Trusted Autofix Policy
        id: trusted
        if: steps.pr.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          model="$INPUT_MODEL"
          turns="$INPUT_MAX_TURNS"
          verify="$INPUT_VERIFY_COMMAND"
          path=".github/pr-autofix-trusted.yml"
          if gh api "repos/$GH_REPO/contents/$path?ref=$DEFAULT_BRANCH" --jq .content > "$RUNNER_TEMP/trusted.b64" 2>/dev/null; then
            tr -d '\n' < "$RUNNER_TEMP/trusted.b64" | base64 -d > "$RUNNER_TEMP/trusted.yml"
            file_model=$(awk '/^model:/ { print $2; exit }' "$RUNNER_TEMP/trusted.yml")
            if [ -n "$file_model" ]; then model="$file_model"; fi
            file_turns=$(awk '/^max_turns:/ { print $2; exit }' "$RUNNER_TEMP/trusted.yml")
            case "$file_turns" in
              '' | *[!0-9]*) ;;
              *) turns="$file_turns" ;;
            esac
            if [ -z "$verify" ]; then
              verify=$(awk '
                /^verify_command:/ { capture = 1; next }
                capture && /^[^[:space:]]/ { exit }
                capture { print }
              ' "$RUNNER_TEMP/trusted.yml")
            fi
            file_max=$(awk '/^max_iterations:/ { print $2; exit }' "$RUNNER_TEMP/trusted.yml")
            case "$file_max" in
              '' | *[!0-9]*) ;;
              *) echo "max_iterations=$file_max" >> "$GITHUB_OUTPUT" ;;
            esac
            file_bots=$(awk '
              /^allowed_bots:/ { in_list = 1; next }
              in_list && /^[[:space:]]*-/ {
                sub(/^[[:space:]]*-[[:space:]]*/, "")
                sub(/[[:space:]]*#.*$/, "")
                sub(/[[:space:]]+$/, "")
                print
                next
              }
              in_list && /^[^[:space:]#-]/ { in_list = 0 }
            ' "$RUNNER_TEMP/trusted.yml" | tr -d "\"'" | paste -sd, -)
            if [ -n "$file_bots" ]; then echo "allowed_bots=$file_bots" >> "$GITHUB_OUTPUT"; fi
          fi
          # The org/repo variable is the owner-controlled fleet switch (org admins only,
          # no PR branch can set it),  so it outranks even the trusted-file pin.
          if [ -n "$VAR_MODEL" ]; then model="$VAR_MODEL"; fi
          {
            echo "model=$model"
            echo "max_turns=$turns"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$verify" ]; then
            printf '%s' "$verify" > "$RUNNER_TEMP/verify.sh"
            echo "has_verify=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_verify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Autofix App Credentials
        id: app_push
        if: steps.pr.outputs.proceed == 'true' && vars.SWU_AUTOFIX_GITHUB_APP_ID != ''
        env:
          AUTOFIX_APP_PRIVATE_KEY: ${{ secrets.AUTOFIX_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$AUTOFIX_APP_PRIVATE_KEY" ]; then
            echo "::notice::SWU_AUTOFIX_GITHUB_APP_ID is set but AUTOFIX_GITHUB_APP_PRIVATE_KEY is empty; skipping App-token mint"
            echo "mint_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "mint_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint Autofix Push Token
        id: push_token
        # Step if cannot reference secrets (AFC-308 startup validation).  app_push confirms the key.
        if: steps.app_push.outputs.mint_token == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SWU_AUTOFIX_GITHUB_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Check Out The PR Branch
        if: steps.pr.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check The Comment And Build The Prompt
        id: guard
        if: steps.pr.outputs.proceed == 'true'
        env:
          TRUSTED_MAX_ITERATIONS: ${{ steps.trusted.outputs.max_iterations }}
          TRUSTED_ALLOWED_BOTS: ${{ steps.trusted.outputs.allowed_bots }}
          NOTIFY_URL: ${{ vars.SWU_AUTOFIX_NOTIFY_URL }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/autofix"
          mkdir -p "$dir"

          skip() {
            echo "::notice::$1"
            echo "should_fix=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # A pull_request_review carries .review, the two comment events carry .comment.  The text
          # goes to a file, never to a step output or an environment variable:  an output line that
          # is not name=value is the error this step used to die with, a body that repeated the
          # heredoc delimiter could write outputs of its own, and one environment string tops out
          # near 128 KB.
          author=$(jq -r '(.review // .comment).user.login // empty' "$GITHUB_EVENT_PATH")
          jq -r '(.review // .comment).body // empty' "$GITHUB_EVENT_PATH" > "$dir/comment.txt"
          path=$(jq -r '.comment.path // empty' "$GITHUB_EVENT_PATH")
          line=$(jq -r '.comment.line // .comment.original_line // empty' "$GITHUB_EVENT_PATH")

          # jq prints an empty string as a blank line, so test for any non-blank character.
          grep -q '[^[:space:]]' "$dir/comment.txt" || skip "Empty comment body, skipping"

          # Owner rule 2026-10-21:  a comment or review is an autofix request only when the
          # tag is the FIRST TOKEN of the first non-blank line after fenced code and quoted
          # text are stripped.  A review or verification reply that mentions the tag while discussing
          # it (Kody quoting the trigger phrase, AFC run 39608718486) is discussion, not a
          # request.  Sentry is exempt from the tag, the once-per-PR cap, and the
          # notification (owner:  "Sentry can request all you want").
          requester=$(printf '%s' "$author" | tr 'A-Z' 'a-z' | sed 's/\[bot\]$//')
          GATE_BODY_FILE="$dir/comment.txt"
          GATE_TAG='@pr-autofix'
          # REQUEST-GATE-BEGIN - scripts/test_autofix_request_gate.py runs this exact block.
          awk '
            fence == "" && /^[[:space:]]*>/ { next }
            fence == "" {
              s = $0
              sub(/^[[:space:]]*/, "", s)
              c = substr(s, 1, 1)
              n = 0
              if (c != "") { while (substr(s, n + 1, 1) == c) n++ }
              if ((c == "`" || c == "~") && n >= 3) { fence = c; flen = n; next }
              print
              next
            }
            {
              s = $0
              sub(/^[[:space:]]*/, "", s)
              c = substr(s, 1, 1)
              n = 0
              if (c != "") { while (substr(s, n + 1, 1) == c) n++ }
              # Only a pure run of the same marker as the opener, at least as
              # long as the opener and carrying no info string, closes the fence.
              if (c == fence && n >= flen && substr(s, n + 1) ~ /^[[:space:]]*$/) { fence = ""; flen = 0 }
              next
            }
          ' "$GATE_BODY_FILE" > "$RUNNER_TEMP/request_text.txt"
          gate_line=$(grep -m1 -E '[^[:space:]]' "$RUNNER_TEMP/request_text.txt" || true)
          if printf '%s' "$gate_line" | grep -qiE "^[[:space:]]*${GATE_TAG}([^A-Za-z0-9_-]|\$)"; then
            gate_verdict=request
          else
            gate_verdict=discussion
          fi
          # The skip decision lives inside the marked block so the polarity of
          # this comparison is covered by the extracted-block test.
          gate_skip=false
          if [ "$requester" != "sentry" ] && [ "$gate_verdict" != "request" ]; then
            gate_skip=true
          fi
          # REQUEST-GATE-END
          if [ "$gate_skip" = "true" ]; then
            skip "No @pr-autofix request at the start of the comment, skipping"
          fi

          # Trust boundary: the list comes from the default branch, never from the PR checkout.
          # The default-branch trusted policy's allowed_bots, when it has one, wins over the
          # caller input — a same-repo branch edits its own copy of the caller workflow, so the
          # input alone is not the boundary.  The PR branch's .autofix.yml may only REMOVE bots
          # from that list.  A branch file that could add one would swap the trust boundary on a
          # workflow holding contents: write, which is how any same-repo branch PR could point the
          # run at an arbitrary bot before this check narrowed instead of replaced.
          allowed="$INPUT_ALLOWED_BOTS"
          if [ -n "${TRUSTED_ALLOWED_BOTS:-}" ]; then allowed="$TRUSTED_ALLOWED_BOTS"; fi
          max="$DEFAULT_MAX_ITERATIONS"
          if [ -n "${TRUSTED_MAX_ITERATIONS:-}" ]; then max="$TRUSTED_MAX_ITERATIONS"; fi
          if [ -f .autofix.yml ]; then
            echo "::notice::Narrowing allowed_bots from .autofix.yml"
            file_allowed=$(awk '
              /^allowed_bots:/ { in_list = 1; next }
              in_list && /^[[:space:]]*-/ {
                sub(/^[[:space:]]*-[[:space:]]*/, "")
                sub(/[[:space:]]*#.*$/, "")
                sub(/[[:space:]]+$/, "")
                print
                next
              }
              in_list && /^[^[:space:]#-]/ { in_list = 0 }
            ' .autofix.yml | tr -d "\"'" | paste -sd, -)
            if [ -n "$file_allowed" ]; then
              if [ -z "$allowed" ]; then
                # The caller trusted every bot, so any branch list is still a narrowing.
                allowed="$file_allowed"
              else
                narrowed=""
                IFS=',' read -r -a file_bots <<< "$file_allowed"
                for file_bot in "${file_bots[@]}"; do
                  file_bot=$(printf '%s' "$file_bot" | tr -d '[:space:]')
                  if [ -z "$file_bot" ]; then continue; fi
                  case ",$allowed," in
                    *",$file_bot,"*)
                      if [ -n "$narrowed" ]; then narrowed="$narrowed,$file_bot"; else narrowed="$file_bot"; fi ;;
                    *)
                      echo "::notice::.autofix.yml allowed_bots entry '$file_bot' is outside the trusted list, dropping it" ;;
                  esac
                done
                if [ -z "$narrowed" ]; then
                  skip ".autofix.yml narrows the trusted bot list to nothing, skipping"
                fi
                allowed="$narrowed"
              fi
            fi
          fi

          # The list is authoritative:  only a listed bot may start a run.  An earlier version let
          # any comment containing words like `error:` or `warning:` through regardless of author,
          # which let an unrelated bot (a deploy or error-tracking app) start a paid run.  An empty
          # list, which only a caller can produce by passing an empty input, allows every bot.
          if [ -n "$allowed" ]; then
            match=0
            IFS=',' read -r -a bots <<< "$allowed"
            for bot in "${bots[@]}"; do
              bot=$(printf '%s' "$bot" | tr -d '[:space:]')
              if [ "$bot" = "$author" ]; then match=1; break; fi
            done
            if [ "$match" -ne 1 ]; then
              skip "Author '$author' is not in the allowed bot list, skipping"
            fi
          fi

          # Owner rule 2026-10-20:  one autofix run per bot per PR;  the owner
          # (jaywedgeworth22) is unlimited,  and Sentry is exempt from the limit and the
          # notification.  The record is a marker comment the accepted run leaves on the PR —
          # deleting that comment is the manual reset.  Every other bot request,  accepted or
          # not,  is reported to the owner through SWU_AUTOFIX_NOTIFY_URL when configured.
          if [ "$requester" != "jaywedgeworth22" ] && [ "$requester" != "sentry" ]; then
            marker="swu-autofix-run: bot=$requester"
            prior=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments?per_page=100" --paginate \
              --jq ".[].body | select(contains(\"$marker\"))" 2> /dev/null | head -1 || true)
            accepted=true
            if [ -n "$prior" ]; then accepted=false; fi
            if [ -n "${NOTIFY_URL:-}" ]; then
              jq -n --arg repo "$GH_REPO" --arg pr "$PR_NUMBER" --arg bot "$requester" \
                --arg event "$GITHUB_EVENT_NAME" --arg accepted "$accepted" \
                --arg run "$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID" \
                '{repo:$repo, pr:$pr, bot:$bot, event:$event, accepted:$accepted, run:$run}' \
              | curl -sfS -m 10 -X POST -H 'Content-Type: application/json' --data-binary @- "$NOTIFY_URL" \
                || echo "::notice::owner notification for $requester's request failed (non-blocking)"
            else
              echo "::notice::SWU_AUTOFIX_NOTIFY_URL is not set, owner notification for $requester's request skipped"
            fi
            if [ "$accepted" = "false" ]; then
              skip "$author already used its one autofix run on this PR, skipping"
            fi
            gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
              -f body="<!-- $marker --> Autofix run $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID started for \`$author\`'s tagged request.  One autofix run per bot per PR (owner rule 2026-10-20);  delete this comment to reset." \
              > /dev/null
          fi

          # The cap is per PR:  count the autofix commits this branch has that the default branch
          # does not.  grep -c prints the count and exits 1 when it is 0, so `|| true` and nothing
          # else keeps the output a single number.  The subject test matches what the Commit step
          # writes.
          subjects=$(git log --format=%s "origin/$DEFAULT_BRANCH..HEAD")
          prior=$(printf '%s\n' "$subjects" | grep -c '^autofix:' || true)
          iteration=$((prior + 1))
          if [ "$iteration" -gt "$max" ]; then
            skip "Iteration limit reached ($iteration > $max), skipping"
          fi

          # The diff is context only, so cap it.
          gh pr diff "$PR_NUMBER" 2> /dev/null | head -c 100000 > "$dir/pr.diff" || true
          if [ "$(wc -c < "$dir/pr.diff")" -ge 100000 ]; then
            echo "(diff truncated)" >> "$dir/pr.diff"
          fi

          {
            echo "You are fixing a code review comment on a pull request.  Make minimal, targeted changes to address the comment."
            echo
            echo "## Review Comment"
            cat "$dir/comment.txt"
            if [ -n "$path" ]; then
              echo
              echo "## Location"
              echo "File: $path"
              if [ -n "$line" ]; then
                echo "Line: $line"
              fi
            fi
            if [ -s "$dir/pr.diff" ]; then
              echo
              echo "## PR Diff (for context)"
              echo '```diff'
              cat "$dir/pr.diff"
              echo '```'
            fi
            echo
            echo "## Instructions"
            echo "- Read the relevant file(s) and understand the context"
            echo "- Make the minimum change needed to address the review comment"
            echo "- Do not refactor unrelated code"
            echo "- Do not add comments explaining the fix unless the review asked for comments"
            echo "- If the comment is unclear or you cannot determine a fix, make no changes"
          } > "$dir/prompt.md"

          {
            echo "should_fix=true"
            echo "iteration=$iteration"
            echo "max_iterations=$max"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Autofix iteration $iteration / $max for a comment by $author"

      - name: Install Claude Code
        if: steps.guard.outputs.should_fix == 'true'
        env:
          CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Run The Fix
        id: fix
        if: steps.guard.outputs.should_fix == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ vars.SWU_AUTOFIX_MODEL_BASE_URL == 'https://api.meta.ai' && (secrets.META_MODEL_API_TOKEN || 'MISSING-META-MODEL-API-TOKEN') || secrets.MINIMAX_API_KEY }}
          ANTHROPIC_MODEL: ${{ steps.trusted.outputs.model }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ steps.trusted.outputs.model }}
          MAX_TURNS: ${{ steps.trusted.outputs.max_turns }}
        run: |
          set -euo pipefail
          stream="$RUNNER_TEMP/claude-stream.ndjson"
          out="$RUNNER_TEMP/claude-execution-output.json"
          echo "::group::Claude Code output"
          claude --print --verbose --dangerously-skip-permissions \
            --max-turns "$MAX_TURNS" \
            --allowed-tools "Edit,Write,Read,Bash,Grep,Glob" \
            --output-format stream-json \
            < "$RUNNER_TEMP/autofix/prompt.md" | tee "$stream"
          echo "::endgroup::"
          jq -s '.' "$stream" > "$out"

      - name: Summarize Autofix Diagnostics
        if: ${{ always() && steps.guard.outputs.should_fix == 'true' }}
        id: diagnostics
        uses: Simple-With-Us/AI-Fleet-Coordinator/.github/actions/autofix-diagnostics@070fdbfacadbd9e90cbb54098123df7d3fef737f

      - name: Retain Sanitized Autofix Diagnostics
        if: ${{ always() && steps.guard.outputs.should_fix == 'true' && steps.diagnostics.outputs.summary-path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-autofix-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.diagnostics.outputs.summary-path }}
          if-no-files-found: error
          retention-days: 7

      - name: Extract Usage Counts
        id: usage
        # Only the counters of Claude Code's final result message leave this job (UM-1593):  no prompt,
        # diff, or tool output.  The ingest credential is never present here, because this job runs the
        # model with Bash and could rewrite any file on the runner.
        if: ${{ always() && steps.guard.outputs.should_fix == 'true' }}
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/usage-result.json"
          if [ -s "$RUNNER_TEMP/claude-stream.ndjson" ]; then
            jq -c 'select(.type == "result") | {type, subtype, is_error, duration_ms, num_turns, total_cost_usd, usage, modelUsage}' \
              "$RUNNER_TEMP/claude-stream.ndjson" 2> /dev/null | tail -n 1 > "$out" || true
          fi
          if [ -s "$out" ]; then echo "have=true" >> "$GITHUB_OUTPUT"; fi

      - name: Retain Usage Counts For The Meter Job
        if: ${{ always() && steps.usage.outputs.have == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autofix-usage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/usage-result.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Validate Outcome Before Push
        id: validate
        if: steps.guard.outputs.should_fix == 'true'
        env:
          START_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HAS_VERIFY: ${{ steps.trusted.outputs.has_verify }}
        run: |
          set -euo pipefail
          if [ "${{ steps.fix.outcome }}" != "success" ]; then
            echo "::error::Claude Code exited unsuccessfully; refusing to push"
            exit 1
          fi
          status="${{ steps.diagnostics.outputs.status }}"
          if [ "$status" != "available" ]; then
            echo "::error::Autofix diagnostics unavailable (status=$status); refusing to push"
            exit 1
          fi
          summary="${{ steps.diagnostics.outputs.summary-path }}"
          subtype=$(jq -r '.result.subtype // empty' "$summary")
          is_error=$(jq -r '.result.is_error // empty' "$summary")
          if [ "$subtype" != "success" ] || [ "$is_error" = "true" ]; then
            echo "::error::Autofix result subtype=$subtype is_error=$is_error; refusing to push"
            exit 1
          fi
          current=$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)
          if [ "$current" != "$START_HEAD_SHA" ]; then
            echo "::error::PR head moved during autofix ($START_HEAD_SHA -> $current); refusing to push"
            exit 1
          fi
          if [ "$HAS_VERIFY" = "true" ]; then
            bash -euo pipefail "$RUNNER_TEMP/verify.sh"
          fi

      - name: Commit And Push
        id: push
        if: steps.validate.outcome == 'success'
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
          ITERATION: ${{ steps.guard.outputs.iteration }}
          MAX_ITERATIONS: ${{ steps.guard.outputs.max_iterations }}
          START_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PUSH_TOKEN: ${{ steps.push_token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current=$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)
          if [ "$current" != "$START_HEAD_SHA" ]; then
            echo "::error::PR head moved before push ($START_HEAD_SHA -> $current); aborting"
            exit 1
          fi
          # GITHUB_TOKEN may not create or change files under .github/workflows, and GitHub rejects
          # the whole push when one does.  Leave them out so the rest of the fix still lands.
          git add -A -- . ':(exclude).github/workflows'
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "autofix: address review comment [$ITERATION/$MAX_ITERATIONS]"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/$BRANCH"
          if [ "${{ steps.push_token.outputs.token }}" = "" ]; then
            echo "::warning::Pushed with GITHUB_TOKEN; CI will not re-run until SWU_AUTOFIX GitHub App credentials are configured"
          fi

  # Best-effort metering (UM-1593).  It holds the optional ingest credential, so it runs apart from
  # the job that executes the model.  With no token, or no usage file, it does nothing and cannot
  # fail the run.
  meter:
    needs: autofix
    if: ${{ always() && needs.autofix.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: autofix-usage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/autofix-usage
      - name: Report Usage To Usage Monitor
        continue-on-error: true
        uses: Simple-With-Us/congress-trading-shared/.github/actions/ci-usage-report@65f9ff5a5b1f7a68e729205c14f5ef3e59be561a
        with:
          token: ${{ secrets.USAGE_INGEST_TOKEN }}
          harness: claude-code-ci
          input-file: ${{ runner.temp }}/autofix-usage/usage-result.json
          input-kind: claude
          model: ${{ needs.autofix.outputs.model }}
          pr-number: ${{ github.event.issue.number || github.event.pull_request.number }}
          workflow: pr-autofix-reusable
