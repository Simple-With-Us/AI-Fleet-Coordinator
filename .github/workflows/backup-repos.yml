name: Backup fleet GitHub repositories

# Secondary offsite: zip artifacts retained 90 days.
# Canonical Google Drive copy is the Mac job com.jay.fleet-gdrive-backup
# (scripts/backup-fleet-to-gdrive.py).  Do not set GH_TOKEN to an empty
# secret — that overrides git and fails the job (Personal-Site 2026-08-13..22).

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Archive fleet repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("fleet-apps.json").read_text())
          repos = [a["repo"] for a in data.get("apps", []) if a.get("repo")]
          Path("backup-repo-list.txt").write_text("\n".join(repos) + "\n")
          print("Repos from fleet-apps.json:")
          print("\n".join(repos))
          PY

          mkdir -p backups
          # Authenticated full-history clone with the built-in GITHUB_TOKEN
          # (contents: read):  an unauthenticated shallow clone cannot see
          # private fleet repos and used to fail green,  so a missing repo
          # was a silent gap in the offsite.  Full history keeps the backup
          # a restore,  not a tip snapshot.
          #
          # AFC-682:  one failed target must not discard the archives that
          # succeeded.  The script records failures, keeps the partial set,
          # labels the artifact -PARTIAL via $GITHUB_ENV, and still exits
          # non-zero so a partial run is never green.
          python3 scripts/backup_repos.py \
            --repo-list backup-repo-list.txt \
            --outdir backups \
            --date "$(date +%Y-%m-%d)"

      # !cancelled() so the archives that succeeded still upload when the
      # archive step failed with an ordinary non-zero exit, while a cancelled
      # run skips the upload.  This is the docs-recommended alternative to
      # always(), which runs even on cancel and which GitHub warns can hang
      # until timeout:  docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions
      # The bounded timeout is the backstop, not a cancellation guarantee.
      # The upload path is limited to the zips and the summary the script
      # writes (the zip exclusions keep secrets out), so nothing unintended
      # publishes.
      - name: Upload backup archives as artifacts
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        with:
          name: fleet-repo-backups-${{ github.run_id }}${{ env.BACKUP_ARTIFACT_SUFFIX }}
          path: |
            backups/*.zip
            backups/BACKUP-SUMMARY.txt
          retention-days: 90
          if-no-files-found: error
