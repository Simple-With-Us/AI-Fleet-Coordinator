name: Backup fleet GitHub repositories

# Secondary offsite: zip artifacts retained 90 days.
# Canonical Google Drive copy is the Mac job com.jay.fleet-gdrive-backup
# (scripts/backup-fleet-to-gdrive.py).  Do not set GH_TOKEN to an empty
# secret — that overrides git and fails the job (Personal-Site 2026-08-13..22).

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Archive fleet repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("fleet-apps.json").read_text())
          repos = [a["repo"] for a in data.get("apps", []) if a.get("repo")]
          Path("backup-repo-list.txt").write_text("\n".join(repos) + "\n")
          print("Repos from fleet-apps.json:")
          print("\n".join(repos))
          PY

          mkdir -p backups
          DATE_STR="$(date +%Y-%m-%d)"
          failures=0
          # Authenticated full-history clone with the built-in GITHUB_TOKEN
          # (contents: read):  an unauthenticated shallow clone cannot see
          # private fleet repos and used to fail green,  so a missing repo
          # was a silent gap in the offsite.  Full history keeps the backup
          # a restore,  not a tip snapshot.
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            echo "=========================================="
            echo "Cloning Simple-With-Us/${repo}"
            if git clone "https://x-access-token:${GH_TOKEN}@github.com/Simple-With-Us/${repo}.git" "backups/${repo}"; then
              (
                cd "backups/${repo}"
                zip -rq "../${repo}-backup-${DATE_STR}.zip" . \
                  -x "*/node_modules/*" -x "*/.git/*" -x "*/dist/*" -x "*/build/*" \
                  -x ".env*" -x "*/.env*" \
                  -x "*.key" -x "*/*.key" -x "*.pem" -x "*/*.pem" \
                  -x "*.p12" -x "*/*.p12" -x "*.pfx" -x "*/*.pfx" \
                  -x "id_*" -x "*/id_*" \
                  -x "*credential*" -x "*/*credential*" \
                  -x "*service-account*" -x "*/*service-account*"
              )
              rm -rf "backups/${repo}"
              echo "Archive created: ${repo}-backup-${DATE_STR}.zip"
            else
              echo "::error::could not clone Simple-With-Us/${repo}"
              failures=$((failures + 1))
            fi
          done < backup-repo-list.txt
          if [ "$failures" -gt 0 ]; then
            echo "::error::${failures} repositories failed to clone"
            exit 1
          fi
          # The archive count must equal the fleet-apps.json count:  a silent
          # drop would otherwise read as a complete offsite.
          expected=$(grep -c . backup-repo-list.txt)
          shopt -s nullglob
          zips=(backups/*.zip)
          actual=${#zips[@]}
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::expected ${expected} archives, found ${actual}"
            exit 1
          fi

          echo "Created archives:"
          ls -lh backups/

      - name: Upload backup archives as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fleet-repo-backups-${{ github.run_id }}
          path: backups/*.zip
          retention-days: 90
          if-no-files-found: error
