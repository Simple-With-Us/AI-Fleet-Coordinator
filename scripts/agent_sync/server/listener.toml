# BF-DIRECTOR (BotFleet role).  The one BotFleet seat the listener holds:  the other ten are
# "none" because BotFleet drives its own roles, but the owner wants Director woken from here
# (owner, Mon, Oct 13).  The Zulip guide records bf-director-bot@ (realm verified 2026-10-13).
# Disabled until ZULIP_ALERT_BF_DIRECTOR_ENDPOINT and ZULIP_ALERT_BF_DIRECTOR_KEY are in
# Infisical; flipping enabled to true arms it.  outgoing_webhook_seats includes this seat so a
# migrated type-3 bot can wake other seats while this section stays off.
