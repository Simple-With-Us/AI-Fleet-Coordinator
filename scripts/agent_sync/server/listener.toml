# simple-chat listener config for the SERVER instance (the Coolify container on the Hetzner box).
# Design:  docs/protocols/agent-sync-server.md in AI-Fleet-Coordinator.
#
# It holds no secrets.  Each seat's Zulip email and API key, ZULIP_SITE, and each routine's URL and sender key reach
# the container as environment variables, from one of two sources under the same names.  Infisical (fleet-secrets'
# source) is the intended one;  Coolify copies are the fallback:
#   - Infisical at start:  when Coolify sets INFISICAL_CLIENT_ID, INFISICAL_CLIENT_SECRET and INFISICAL_PROJECT_ID
#     (a read-only machine identity), the entrypoint loads the listener's variables from Infisical (project
#     "AI Fleet Coordinator", environment prod, folder /zulip) on every start (server/infisical_env.py), and an
#     Infisical value wins over a Coolify one of the same name;
#   - fallback, runtime-only Coolify variables copied from that folder (the entrypoint logs an ERROR when a
#     partial Infisical identity forces this).
# ZULIP_SITE is never in Infisical:  Coolify sets it.  The Zulip names are the defaults (ZULIP_<CODE>_EMAIL and
# ZULIP_<CODE>_API_KEY, where CODE is the seat with hyphens as underscores).  A Grok Bot persona's routine reads
# the webhook names Infisical already holds, ZULIP_ALERT_GB_<ROLE>_ENDPOINT (the https URL) and
# ZULIP_ALERT_GB_<ROLE>_KEY (the bare crsr_ key, sent as Authorization: Bearer <key>).  The matching
# ZULIP_ALERT_GB_<ROLE>_HEADER is never read.  Set email_env, key_env or the routine's url_env and key_env to use
# other names.
#
# The container copies this file onto its volume (AGENT_SYNC_CONFIG) on first start.  Then
# `simple-chat daemon init` pins owner_user_id (and the optional eligible_user_ids) in that copy, and
# `simple-chat daemon reload` (or a restart) applies it.  Until then nothing is treated as the
# owner and nothing wakes.  A reload re-reads only this file:  a new or changed environment
# variable reaches the listener only when the container restarts.  A section changed here never reaches a live
# volume by itself:  server/apply_live_config.py copies the JET and GB sections into /data/listener.toml, adds
# [listener_api] and [notes_queue] only where the live file has none (it never changes one that is there), and leaves
# [daemon] (the pins) untouched.  Never mount this file as a single file, because `daemon init` replaces it
# atomically.  Every seat here must be "server" in docs/protocols/agent-sync-partition.toml:  a seat is never
# configured in both instances.

[daemon]
instance = "server"
# Sender eligibility also includes the eleven BF bots.  That allowlist does not enable a queue:
# only BF-DIRECTOR has a server section, and it stays disabled.
outgoing_webhook_seats = ["ECHO", "INSTINCT", "JET", "GB-COMPILER", "GB-DIRECTOR", "GB-TRADER", "GB-DEPLOYER", "GB-DESIGNER", "GB-ORACLE", "GB-PUBLISHER", "GB-PLUMBER", "GB-FIXER", "GB-HOUSEKEEPER", "GB-MONITOR", "GB-ENGINEER", "BF-BUILDER", "BF-COMPILER", "BF-DEPLOYER", "BF-DESIGNER", "BF-DIRECTOR", "BF-FIXER", "BF-HOUSEKEEPER", "BF-MONITOR", "BF-ORACLE", "BF-PLUMBER", "BF-PUBLISHER"]
owner_user_id = 0                 # pinned by `simple-chat daemon init`, never derived at runtime
eligible_user_ids = []            # optional extra pins:  every fleet bot is eligible at runtime (owner 2026-10-09)
owner_clients = ["website", "ZulipMobile", "ZulipFlutter", "ZulipElectron", "ZulipDesktop"]
stale_after_minutes = 120
coalesce_seconds = 20
coalesce_max_seconds = 90
owner_coalesce_seconds = 5
notify_banners = false            # no display here:  notify-owner writes only <seat>/owner-queue.jsonl
held_alert_minutes = 60           # the `#alerts` held-back digest (AFC-257):  ONE post for every seat per hour.
                                  # Anything held back is posted, not only an eviction (owner, Oct 11 2026);
                                  # the window is what keeps that loud trigger from flooding the channel.  0 is off.
held_alert_seat = "MA"            # whose bot carries it:  MA posts for the whole instance, so a seat that is
                                  # itself busy never has to speak for everyone.  Optional:  unset falls back to
                                  # the claude seat, then to the first enabled seat.  The post names no one with
                                  # an @-mention, and #alerts is a presence topic, so it never wakes a seat.
presence_topics = [["work-in-progress", "roll call"], ["work-in-progress", "fleet"], ["builds", "gates"], ["alerts", "*"]]

# Cloud seats (MA, GROK-WEB, WISE and ECHO):  enabled with wake = "inbox".  JET is the same, but its
# wake is "http" (see its block).  Each holds a queue,
# so its @-mentions and DMs are captured at zero tokens under /data/<SEAT>/, and its key is checked at
# connect (a member or moderator bot, and the key's own bot must be the seat).  They have no wake
# adapter, so nothing is woken, and nothing reads those inboxes yet:  the hosted MCP inbox tool asks
# Zulip itself.  Read one inside the container with `simple-chat inbox --local --as <SEAT>`.  Their
# variables are ZULIP_<CODE>_EMAIL and ZULIP_<CODE>_API_KEY, and they reach the container only when the
# app restarts (a reload does not read the environment).  The partition gives all five to "server".
# Enable only after the public reverse proxy is ready.  Empty tokens deny every seat.
[outgoing_webhook]
enabled = false
bind = "0.0.0.0"
port = 8787

# AFC-326 is a separate, explicit cutover.  This sample and existing live volumes stay off.
[muse_bridge]
enabled = false

# The signed read API (AFC-330, scripts/agent_sync/listener_api.py):  GET /listener/v1/<SEAT>/<record> for
# the hosted Worker's listener_* tools.  Each seat's key is its hmac routine key (JET_ROUTINE_KEY) or
# <CODE>_ROUTINE_KEY, the same value as the Worker's WAKE_HMAC_KEY_<SEAT>;  a seat without one gets 404.
# Read-only.  Enable only after the reverse proxy routes /listener/v1/ here (docs/protocols/agent-sync-server.md).
[listener_api]
enabled = false
bind = "0.0.0.0"
port = 8788

# The Operator's Apple Notes queue (AFC-486, docs/protocols/operator-notes.md, scripts/agent_sync/notes_queue.py):
# POST /notes/v1/requests, GET /notes/v1/requests/<SEAT>/<request_id>, GET /notes/v1/log and the Mac runner's
# /notes/v1/runner/ routes, on the listener API's port above (so [listener_api] must be enabled too).  No Zulip
# message is involved.  Each principal signs with its own key from Infisical (project AI Fleet Coordinator, prod,
# folder /operator, loaded at start by server/infisical_env.py):  OPERATOR_NOTES_WORKER_KEY (the ST-MCP Worker),
# OPERATOR_NOTES_SERVER_KEY (this server's CLIs and stdio MCP) and OPERATOR_NOTES_RUNNER_KEY (the Mac runner, which
# claims requests and runs apple-notes-coding.sh).  A principal without a key of 32 characters or more is refused
# (404), and the log shows notes-queue-started with the principals that have one, or notes-queue-off.
# worker_seats and server_seats are the seats the WORKER and SERVER principals may act for;  a seat must also be a
# live agent identity.  The server instance only.  Enable after the three keys are in Infisical and the reverse
# proxy routes /notes/v1/ to port 8788, then restart the app (a reload re-reads this file, never the keys).
[notes_queue]
enabled = false
worker_seats = ["JET", "GROK-WEB", "ECHO", "WISE", "CURSOR", "CLAUDE"]
server_seats = ["CLAUDE", "CODEX"]

[seat.MA]
instance = "server"
creds = "env"                     # ZULIP_MA_EMAIL, ZULIP_MA_API_KEY (muse-assist-bot@)
wake = "inbox"

# JET (ChatGPT) is woken through OpenAI MCP Events:  the http wake POSTs agent-sync-wake/1 to the hosted
# MCP Worker (https://agents.simplewithus.com/internal/wake/JET), which sends a signed `zulip.mention` event to
# every ChatGPT chat or dot that subscribed (scripts/agent-sync-mcp/ARMING-JAY.md, "Wake Jet").  JET_ROUTINE_URL
# is that URL;  JET_ROUTINE_KEY is the shared HMAC key, the same value as the Worker secret WAKE_HMAC_KEY_JET
# (Infisical Fleet-OPS, `fleet-secrets get JET_ROUTINE_KEY`).  Until both are set and the container restarts, each wake
# is logged as routine-unready and dropped;  the inbox still captures everything.  The budget is explicit
# because every wake starts a ChatGPT task.  A volume seeded before this change keeps JET on "inbox":  switch
# it with the scoped edit in ARMING-JAY.md "Wake Jet", step 1b.
[seat.JET]
instance = "server"
creds = "env"                     # ZULIP_JET_EMAIL, ZULIP_JET_API_KEY (openai-dot-bot@)
wake = "http"
# timeout_seconds stays at 15 or more:  the Worker answers only after it tried ChatGPT (about 10 seconds at
# most), and its 503 asks for this daemon's retry (docs/protocols/agent-sync-mcp.md section 3.12, item 11).
routine = { url_env = "JET_ROUTINE_URL", key_env = "JET_ROUTINE_KEY", method = "POST", auth = "hmac-sha256", header = "X-Agent-Sync-Signature", timeout_seconds = 15 }
budget = { wakes_per_hour = 6, wakes_per_day = 40, per_topic_per_hour = 2, owner_per_day = 30, owner_per_topic_per_hour = 6, usd_per_day = 2.0, board_per_day = 0 }

[seat.GROK-WEB]
instance = "server"
creds = "env"                     # ZULIP_GROK_WEB_EMAIL, ZULIP_GROK_WEB_API_KEY (grok-web-bot@)
wake = "inbox"

[seat.WISE]
instance = "server"
creds = "env"                     # ZULIP_WISE_EMAIL, ZULIP_WISE_API_KEY (Wise-zuliprc bot)
wake = "inbox"

# Echo is Instinct's partner bot and may be retired when the two merge.  Kept minimal on purpose.
[seat.ECHO]
instance = "server"
creds = "env"                     # ZULIP_ECHO_EMAIL, ZULIP_ECHO_API_KEY (instinct-bat-bot@)
wake = "inbox"
muse_bridge = false               # enable only after the Mac pull, Muse pin and receipt gate pass

# Grok Bot (GB) personas (Sat, Oct 10):  each is woken on an @-mention or a DM through its Grok Bot routine webhook,
# POST agent-sync-wake/1 with Authorization: Bearer <ZULIP_ALERT_GB_<ROLE>_KEY>.  The routine replies in Zulip with the
# persona's own key.  Each section reads five different variables:  the Zulip email, key and site, and the
# routine URL and key.  Enabling or disabling one is the `enabled` line, then a restart.

# GB-DIRECTOR (Routing, fleet sync, org help, director-grok-bot@).
[seat.GB-DIRECTOR]
instance = "server"
enabled = true
creds = "env"                     # ZULIP_GB_DIRECTOR_EMAIL, ZULIP_GB_DIRECTOR_API_KEY; the site from ZULIP_SITE
wake = "http"
routine = { url_env = "ZULIP_ALERT_GB_DIRECTOR_ENDPOINT", key_env = "ZULIP_ALERT_GB_DIRECTOR_KEY", method = "POST", auth = "bearer", header = "Authorization", timeout_seconds = 15 }
budget = { wakes_per_hour = 6, wakes_per_day = 40, per_topic_per_hour = 2, owner_per_day = 20, owner_per_topic_per_hour = 6, usd_per_day = 2.0, board_per_day = 0 }

