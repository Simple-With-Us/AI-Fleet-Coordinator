# agent-sync listener config for the SERVER instance (the Coolify container on the Hetzner box).
# Design:  docs/protocols/agent-sync-server.md in AI-Fleet-Coordinator.
#
# It holds no secrets.  Each Grok Bot persona's Zulip email and API key, ZULIP_SITE, and each
# routine's URL and sender key reach the container as environment variables, copied by hand from Infisical
# (project "AI Fleet Coordinator", environment prod, folder /zulip) into Coolify with a script;
# no Infisical sync is configured.  The names below are the defaults
# (ZULIP_<CODE>_EMAIL, ZULIP_<CODE>_API_KEY, <CODE>_ROUTINE_URL, <CODE>_ROUTINE_KEY, where CODE is
# the seat with hyphens as underscores); set email_env, key_env or the routine's url_env and
# key_env to use other names.
#
# The container copies this file onto its volume (AGENT_SYNC_CONFIG) on first start.  Then
# `agent-sync daemon init` pins owner_user_id and eligible_user_ids in that copy, and
# `agent-sync daemon reload` (or a restart) applies it.  Until then nothing is treated as the
# owner and nothing wakes.  A reload re-reads only this file:  a new or changed environment
# variable reaches the listener only when the container restarts.  Edit this copy in place (the
# image has no editor; see the server doc), and never mount it as a single file, because
# `daemon init` replaces it atomically.  Every seat here must be "server" in
# docs/protocols/agent-sync-partition.toml:  a seat is never configured in both instances.

[daemon]
instance = "server"
owner_user_id = 0                 # pinned by `agent-sync daemon init`, never derived at runtime
eligible_user_ids = []            # fleet seat bots, pinned by `agent-sync daemon init`
owner_clients = ["website", "ZulipMobile", "ZulipFlutter", "ZulipElectron", "ZulipDesktop"]
stale_after_minutes = 120
coalesce_seconds = 20
coalesce_max_seconds = 90
owner_coalesce_seconds = 5
notify_banners = false            # no display here:  notify-owner writes only <seat>/owner-queue.jsonl
presence_topics = [["agent-sync", "roll call"], ["agent-sync", "fleet"], ["builds", "gates"], ["alerts", "*"]]

# GB-Compiler:  enabled, woken through its Grok Bot routine.  The request format is pending from
# GB-Compiler; change method, auth, header or signature_prefix here when it lands.  auth is
# "bearer" (Authorization: Bearer <key>), "header" (the key itself in `header`) or "hmac-sha256"
# (the hex HMAC-SHA256 of the raw body, keyed with the sender key, in `header`).
[seat.GB-COMPILER]
instance = "server"
creds = "env"                     # ZULIP_GB_COMPILER_EMAIL, ZULIP_GB_COMPILER_API_KEY; the site from ZULIP_SITE
wake = "http"
routine = { url_env = "GB_COMPILER_ROUTINE_URL", key_env = "GB_COMPILER_ROUTINE_KEY", method = "POST", auth = "bearer", header = "Authorization", timeout_seconds = 15 }
budget = { wakes_per_hour = 6, wakes_per_day = 40, per_topic_per_hour = 2, owner_per_day = 20, owner_per_topic_per_hour = 6, usd_per_day = 2.0, board_per_day = 0 }

# GB-DIRECTOR (Routing, fleet sync, org help, director-grok-bot@).  Present but disabled:  no routine yet.  It is a realm moderator now, which the listener accepts.
# The routine block names its variables in advance; the routine itself does not exist yet.  To enable, follow
# "Enabling Another Persona" in docs/protocols/agent-sync-server.md:  variables into Infisical and Coolify,
# enabled = true here, then restart the app (a reload does not read new environment variables).
[seat.GB-DIRECTOR]
instance = "server"
enabled = false
creds = "env"                     # ZULIP_GB_DIRECTOR_EMAIL, ZULIP_GB_DIRECTOR_API_KEY
wake = "http"
routine = { url_env = "GB_DIRECTOR_ROUTINE_URL", key_env = "GB_DIRECTOR_ROUTINE_KEY", method = "POST", auth = "bearer", header = "Authorization", timeout_seconds = 15 }
budget = { wakes_per_hour = 6, wakes_per_day = 40, per_topic_per_hour = 2, owner_per_day = 20, owner_per_topic_per_hour = 6, usd_per_day = 2.0, board_per_day = 0 }

