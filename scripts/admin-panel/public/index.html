<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Fleet Admin</title>
<link rel="icon" type="image/png" href="/muse-assist.png">
<link rel="apple-touch-icon" href="/muse-assist.png">
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --faint: #a1a1a6;
    --line: rgba(0, 0, 0, .07);
    --hover: rgba(0, 0, 0, .045);
    --ring: #0a84ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .05);
    --ok: #0f7b34;
    --ok-bg: rgba(16, 163, 74, .13);
    --warn: #9a5b00;
    --warn-bg: rgba(245, 158, 11, .17);
    --bad: #bb2424;
    --bad-bg: rgba(220, 38, 38, .13);
    --off: #6e6e73;
    --off-bg: rgba(120, 120, 128, .13);
    --skel: rgba(0, 0, 0, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161617;
      --card: #1f1f21;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --faint: #7c7c81;
      --line: rgba(255, 255, 255, .08);
      --hover: rgba(255, 255, 255, .06);
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
      --ok: #4ade80;
      --ok-bg: rgba(74, 222, 128, .15);
      --warn: #fbbf24;
      --warn-bg: rgba(251, 191, 36, .16);
      --bad: #ff6b6b;
      --bad-bg: rgba(255, 107, 107, .16);
      --off: #a1a1a6;
      --off-bg: rgba(161, 161, 166, .14);
      --skel: rgba(255, 255, 255, .07);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 48px 32px 56px; }

  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .lede { margin: 6px 0 0; color: var(--muted); font-size: 15px; max-width: 62ch; }
  .hdr-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
  .portal-nav {
    display: inline-flex;
    align-items: center;
    background: rgba(0, 0, 0, .05);
    border: 1px solid var(--line);
    border-radius: 980px;
    padding: 3px;
    gap: 2px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .portal-nav {
      background: rgba(255, 255, 255, .08);
    }
  }
  .portal-pill {
    display: inline-flex;
    align-items: center;
    padding: 5px 14px;
    border-radius: 980px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    text-decoration: none;
    transition: all .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .portal-pill:hover {
    color: var(--text);
    background: var(--hover);
  }
  .portal-pill:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }
  .portal-pill.active {
    background: var(--card);
    color: var(--text);
    font-weight: 600;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .08), var(--shadow);
    cursor: default;
  }
  .checked { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
  .checked b { display: block; color: var(--text); font-size: 14px; font-weight: 600; }

  button {
    height: 38px; padding: 0 16px; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--text);
    box-shadow: var(--shadow); -webkit-appearance: none; appearance: none;
  }
  button:hover { background: var(--hover); }
  button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  button[disabled] { opacity: .55; cursor: default; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    grid-auto-flow: row dense; gap: 16px; margin-top: 28px; align-items: start;
  }
  section {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 10px 10px; box-shadow: var(--shadow); min-width: 0;
  }
  section.span2 { grid-column: span 2; }
  @media (max-width: 760px) { section.span2 { grid-column: auto; } }

  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 10px 4px; }
  h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .card-sub { margin: 0 10px 10px; color: var(--muted); font-size: 12.5px; }
  .card-err {
    margin: 0 10px 10px; color: var(--bad); background: var(--bad-bg); border-radius: 8px;
    padding: 7px 9px; font-size: 12px; word-break: break-word;
  }
  /* The call worked and still had something to say — a note, not a failure. */
  .card-note {
    margin: 0 10px 10px; color: var(--muted); background: var(--hover); border-radius: 8px;
    padding: 7px 9px; font-size: 12px; word-break: break-word;
  }

  .rows { list-style: none; margin: 0; padding: 0; }
  .row {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px;
    color: inherit; text-decoration: none; min-width: 0;
  }
  a.row:hover { background: var(--hover); }
  a.row:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
  .row .label { min-width: 0; flex: 1; }
  .row .name { display: block; font-size: 14px; font-weight: 500; line-height: 1.25; }
  .row .sub {
    display: block; color: var(--faint); font-size: 12px; line-height: 1.25; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .meta { flex: none; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }

  .pill {
    flex: none; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px;
    border-radius: 999px; font-size: 11.5px; font-weight: 600; letter-spacing: .01em; white-space: nowrap;
    max-width: 240px;
  }
  .pill::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill.up { color: var(--ok); background: var(--ok-bg); }
  .pill.warn { color: var(--warn); background: var(--warn-bg); }
  .pill.down { color: var(--bad); background: var(--bad-bg); }
  .pill.off, .pill.pending { color: var(--off); background: var(--off-bg); }
  .pill.lg { height: 26px; font-size: 12.5px; padding: 0 11px; }

  .search-row { display: flex; gap: 8px; margin: 0 10px 12px; }
  .search {
    flex: 1; min-width: 0; height: 40px; padding: 0 14px; border-radius: 11px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font: inherit; font-size: 14.5px; outline: none; -webkit-appearance: none; appearance: none;
  }
  .search::placeholder { color: var(--faint); }
  .search:focus { border-color: var(--ring); box-shadow: 0 0 0 3px rgba(10, 132, 255, .18); }

  .hit { padding: 8px 10px; border-radius: 10px; display: block; color: inherit; text-decoration: none; }
  a.hit:hover { background: var(--hover); }
  .hit-top { display: flex; align-items: baseline; gap: 8px; }
  .hit-title { font-size: 14px; font-weight: 600; line-height: 1.3; min-width: 0; flex: 1; }
  .hit-score { flex: none; color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .hit-meta { color: var(--faint); font-size: 11.5px; margin-top: 2px; }
  .hit-text {
    color: var(--muted); font-size: 12.5px; margin-top: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .hit-meta .dot { color: var(--line); margin: 0 5px; }

  .empty { color: var(--faint); font-size: 13px; padding: 6px 10px 10px; }

  .skel { height: 11px; border-radius: 6px; background: var(--skel); }
  .skel.w1 { width: 45%; }
  .skel.w2 { width: 68%; }
  .skel.w3 { width: 30%; }
  .skel-row { display: flex; align-items: center; gap: 10px; padding: 11px 10px; }
  .skel-row .skel:last-child { margin-left: auto; width: 54px; height: 16px; border-radius: 999px; }
  .loading .skel { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

  footer { margin-top: 34px; color: var(--faint); font-size: 12px; text-align: center; }
  footer code { font-family: "SF Mono", Menlo, monospace; font-size: 11.5px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  @media (max-width: 560px) {
    .wrap { padding: calc(24px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
    header { flex-direction: column; align-items: flex-start; }
    .hdr-right { justify-content: flex-start; }
    .checked { text-align: left; }
    h1 { font-size: 26px; }
    .grid { grid-template-columns: 1fr; gap: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Fleet Admin</h1>
      <p class="lede">Live status for every fleet app, platform, and service.  The page refreshes on its own every minute.</p>
    </div>
    <div class="hdr-right">
      <nav class="portal-nav" aria-label="Portals">
        <a href="https://home.jays.services/" class="portal-pill">Home</a>
        <a href="https://admin.jays.services/" class="portal-pill active" aria-current="page">Admin</a>
      </nav>
      <span class="pill off lg" id="overall">Checking</span>
      <div class="checked">
        <b id="checked-at">—</b>
        Last checked
      </div>
      <button type="button" id="refresh">Refresh</button>
    </div>
  </header>

  <div class="grid loading" id="grid"></div>

  <footer>
    Served by the <code>admin-jays-services</code> Worker.  Every fleet API is called server side, behind Cloudflare Access.
  </footer>
</div>

<script>
(function () {
  'use strict';


  var CARDS = [
    { key: 'endpoints', title: 'Public Endpoints', wide: true, render: renderEndpoints, skeleton: 8 },
    { key: 'recall', title: 'Fleet Recall', wide: true, render: renderRecall, skeleton: 4 },
    { key: 'board', title: 'The Board', render: renderBoard, skeleton: 4 },
    { key: 'coolify', title: 'Coolify Applications', render: renderCoolify, skeleton: 6 },
    { key: 'github', title: 'GitHub Repositories', wide: true, render: renderGitHub, skeleton: 6 },
    { key: 'vercel', title: 'Vercel Projects', render: renderSimple, skeleton: 5 },
    { key: 'sentry', title: 'Sentry Issues', render: renderSentry, skeleton: 4 },
    { key: 'pagerduty', title: 'PagerDuty Incidents', render: renderSimple, skeleton: 3 },
    { key: 'datadog', title: 'Datadog Monitors', render: renderDatadog, skeleton: 4 },
    { key: 'opsSheet', title: 'Ops Reference Sheet', render: renderSimple, skeleton: 7 }
  ];

  var grid = document.getElementById('grid');
  var overallEl = document.getElementById('overall');
  var checkedEl = document.getElementById('checked-at');
  var refreshBtn = document.getElementById('refresh');
  var lastRecallQuery = '';

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }

  function pill(state, text) {
    var known = { up: 1, warn: 1, down: 1, off: 1, pending: 1 };
    var node = el('span', 'pill ' + (known[state] ? state : 'warn'));
    node.appendChild(el('span', 'pill-text', text));
    node.title = String(text == null ? '' : text);
    return node;
  }

  function stateWord(state) {
    if (state === 'up') return 'Up';
    if (state === 'down') return 'Down';
    if (state === 'off') return 'Not configured';
    if (state === 'pending') return 'Not checked yet';
    return 'Degraded';
  }

  function ms(n) {
    if (typeof n !== 'number') return '';
    return n >= 1000 ? (n / 1000).toFixed(1) + ' s' : n + ' ms';
  }

  function shortDate(value) {
    if (!value) return '';
    var d = new Date(value);
    if (isNaN(d.getTime())) return String(value).slice(0, 10);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'America/Chicago' });
  }

  /* ---------------------------------------------------------- scaffolding */

  function buildScaffold() {
    CARDS.forEach(function (card) {
      var sec = el('section', card.wide ? 'span2' : '');
      sec.id = 'card-' + card.key;

      var head = el('div', 'card-head');
      head.appendChild(el('h2', null, card.title));
      var p = pill('off', 'Checking');
      p.dataset.role = 'pill';
      head.appendChild(p);
      sec.appendChild(head);

      var sub = el('p', 'card-sub', 'Waiting for the first check');
      sub.dataset.role = 'sub';
      sec.appendChild(sub);

      var body = el('div');
      body.dataset.role = 'body';
      body.appendChild(skeletonRows(card.skeleton));
      sec.appendChild(body);

      grid.appendChild(sec);
    });
  }

  function skeletonRows(n) {
    var frag = document.createDocumentFragment();
    for (var i = 0; i < n; i++) {
      var row = el('div', 'skel-row');
      row.appendChild(el('div', 'skel ' + (i % 3 === 0 ? 'w2' : (i % 3 === 1 ? 'w1' : 'w3'))));
      row.appendChild(el('div', 'skel'));
      frag.appendChild(row);
    }
    return frag;
  }

  /* ------------------------------------------------------------ renderers */

  // Only http(s) becomes a link.  Coolify hands us each application's fqdn,
  // which is operator-editable text, and hitList below has always guarded the
  // same case — a row whose url is anything else renders as a plain div.
  function rowNode(opts) {
    var href = opts.url && /^https?:\/\//.test(opts.url) ? opts.url : '';
    var node = href ? el('a', 'row') : el('div', 'row');
    if (href) {
      node.href = href;
      node.target = '_blank';
      node.rel = 'noopener noreferrer';
    }
    var label = el('div', 'label');
    label.appendChild(el('span', 'name', opts.name));
    if (opts.sub) label.appendChild(el('span', 'sub', opts.sub));
    node.appendChild(label);
    if (opts.meta) node.appendChild(el('span', 'meta', opts.meta));
    node.appendChild(pill(opts.state, opts.status));
    return node;
  }

  function list(items, map) {
    var ul = el('ul', 'rows');
    items.forEach(function (item) {
      var li = el('li');
      li.appendChild(rowNode(map(item)));
      ul.appendChild(li);
    });
    return ul;
  }

  function emptyNode(text) {
    return el('p', 'empty', text);
  }

  function renderEndpoints(data) {
    var items = data.items || [];
    if (!items.length) return emptyNode('No endpoints were probed.');
    return list(items, function (i) {
      return {
        name: i.name,
        sub: i.url.replace(/^https:\/\//, ''),
        meta: ms(i.ms),
        state: i.state,
        status: i.detail || stateWord(i.state),
        url: i.url
      };
    });
  }

  function renderCoolify(data) {
    var frag = document.createDocumentFragment();
    var items = data.items || [];
    if (!items.length) frag.appendChild(emptyNode('No applications were returned.'));
    else {
      frag.appendChild(list(items, function (i) {
        return {
          name: i.name,
          sub: i.url ? String(i.url).replace(/^https?:\/\//, '') : '',
          state: i.state,
          status: i.status,
          url: i.url || ''
        };
      }));
    }
    if (data.servers && data.servers.length) {
      frag.appendChild(el('p', 'card-sub', 'Servers'));
      frag.appendChild(list(data.servers, function (s) {
        return { name: s.name, state: s.state, status: s.status };
      }));
    }
    return frag;
  }

  function renderGitHub(data) {
    var items = data.items || [];
    if (!items.length) return emptyNode('No repositories were checked.');
    return list(items, function (i) {
      var run = i.run;
      var status = run
        ? (run.status === 'completed' ? (run.conclusion || 'unknown') : run.status)
        : (i.runError ? 'run check failed' : 'no runs on main');
      var bits = [];
      if (i.prs !== null && i.prs !== undefined) bits.push(i.prs + (i.prs === 1 ? ' open PR' : ' open PRs'));
      else if (i.prError) bits.push('PR count failed');
      if (run && run.updated) bits.push('main ran ' + shortDate(run.updated));
      return {
        name: i.name,
        sub: bits.join(' · '),
        state: i.state,
        status: String(status).replace(/_/g, ' '),
        // Repo link comes from the Worker, which knows the real org.  It used
        // to be hardcoded to Simple-With-Us/ here, which 404s after the
        // Simple-With-Us move -- and GitHub 404s a PRIVATE repo for anyone not
        // signed in, so the link is only as good as the viewer's session.
        url: run && run.url ? run.url : (i.repoUrl || ('https://github.com/' + i.repo))
      };
    });
  }

  function renderSimple(data) {
    var items = data.items || [];
    if (!items.length) return emptyNode('Nothing to show.');
    return list(items, function (i) {
      return {
        name: i.name,
        sub: i.sub || i.service || (i.url ? String(i.url).replace(/^https?:\/\//, '') : ''),
        state: i.state,
        status: i.status || stateWord(i.state),
        url: i.url || ''
      };
    });
  }

  function renderBoard(data) {
    var frag = document.createDocumentFragment();
    var items = data.items || [];
    if (!items.length) frag.appendChild(emptyNode('No counts were returned.'));
    else {
      frag.appendChild(list(items, function (i) {
        return {
          name: i.name,
          state: i.count ? i.state : 'up',
          status: i.count + (i.count === 1 ? ' item' : ' items')
        };
      }));
    }
    if (data.counts) {
      frag.appendChild(el('p', 'card-sub',
        data.counts.total + ' rows total · ' + data.counts.done + ' resolved'));
    }
    if (data.urgent && data.urgent.length) {
      frag.appendChild(el('p', 'card-sub', 'Needs attention'));
      frag.appendChild(list(data.urgent, function (f) {
        return { name: f.name, sub: f.sub, state: f.state, status: f.status, url: f.url || '' };
      }));
    }
    return frag;
  }

  function renderSentry(data) {
    var items = data.items || [];
    var frag = document.createDocumentFragment();
    if (!items.length) frag.appendChild(emptyNode('No unresolved issues in the last 24 hours.'));
    else {
      frag.appendChild(list(items, function (i) {
        return {
          name: i.name,
          sub: i.top || '',
          state: i.state,
          status: i.count + (i.count === 1 ? ' issue' : ' issues'),
          url: (data.link || 'https://sentry.io') + '/issues/?project=&query=is%3Aunresolved'
        };
      }));
    }
    return frag;
  }

  function renderDatadog(data) {
    var frag = document.createDocumentFragment();
    var items = data.items || [];
    if (!items.length) frag.appendChild(emptyNode('No monitors were returned.'));
    else {
      frag.appendChild(list(items, function (i) {
        return { name: i.name, state: i.state, status: i.count + ' monitors' };
      }));
    }
    if (data.alerting && data.alerting.length) {
      frag.appendChild(el('p', 'card-sub', 'Alerting and warning'));
      frag.appendChild(list(data.alerting, function (m) {
        return { name: m.name, state: m.state, status: m.status, url: m.url || '' };
      }));
    }
    return frag;
  }

  function renderRecall(data) {
    var frag = document.createDocumentFragment();

    var form = el('form', 'search-row');
    var input = el('input', 'search');
    input.type = 'search';
    input.id = 'recall-q';
    input.placeholder = 'Search the fleet corpus';
    input.setAttribute('aria-label', 'Search the fleet corpus');
    input.value = lastRecallQuery;
    var btn = el('button', null, 'Search');
    btn.type = 'submit';
    form.appendChild(input);
    form.appendChild(btn);
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      runRecallSearch(input.value.trim());
    });
    frag.appendChild(form);

    var facts = [];
    if (typeof data.points === 'number') facts.push(data.points.toLocaleString('en-US') + ' points');
    if (data.collection) facts.push(data.collection);
    if (data.collectionStatus) facts.push(data.collectionStatus);
    if (data.health && typeof data.health.ms === 'number') facts.push('health in ' + ms(data.health.ms));
    if (data.canary && typeof data.canary.ms === 'number') facts.push('canary in ' + ms(data.canary.ms));
    if (facts.length) frag.appendChild(el('p', 'card-sub', facts.join(' · ')));

    if (data.breakdown && data.breakdown.length) {
      frag.appendChild(el('p', 'card-sub', data.breakdown.map(function (b) {
        return b.name + ' ' + Number(b.count).toLocaleString('en-US');
      }).join(' · ')));
    }

    var results = el('div');
    results.id = 'recall-results';
    var hits = data.items || [];
    if (hits.length) {
      results.appendChild(el('p', 'card-sub', 'Canary query "fleet mode"'));
      results.appendChild(hitList(hits));
    } else {
      results.appendChild(emptyNode('Search the corpus to see hits.'));
    }
    frag.appendChild(results);
    return frag;
  }

  function hitList(hits) {
    var wrap = el('div');
    hits.forEach(function (h) {
      var node = h.url && /^https?:\/\//.test(h.url) ? el('a', 'hit') : el('div', 'hit');
      if (node.tagName === 'A') {
        node.href = h.url;
        node.target = '_blank';
        node.rel = 'noopener noreferrer';
      }
      var top = el('div', 'hit-top');
      top.appendChild(el('div', 'hit-title', h.title || 'Untitled'));
      if (typeof h.score === 'number') top.appendChild(el('div', 'hit-score', h.score.toFixed(3)));
      node.appendChild(top);

      var meta = el('div', 'hit-meta');
      var bits = [];
      if (h.seat) bits.push(h.seat);
      if (h.category) bits.push(h.category);
      if (h.app) bits.push(h.app);
      if (h.date) bits.push(shortDate(h.date));
      var where = h.url || h.path || '';
      if (where) bits.push(String(where).replace(/^https?:\/\//, '').slice(0, 60));
      bits.forEach(function (b, idx) {
        if (idx) meta.appendChild(el('span', 'dot', '·'));
        meta.appendChild(document.createTextNode(b));
      });
      if (bits.length) node.appendChild(meta);

      if (h.text) node.appendChild(el('div', 'hit-text', h.text));
      wrap.appendChild(node);
    });
    return wrap;
  }

  /* ------------------------------------------------------------- plumbing */

  function paintCard(card, data) {
    var sec = document.getElementById('card-' + card.key);
    if (!sec) return;
    var head = sec.querySelector('[data-role="pill"]');
    var sub = sec.querySelector('[data-role="sub"]');
    var body = sec.querySelector('[data-role="body"]');

    var fresh = pill(data.state || 'warn', stateWord(data.state));
    fresh.dataset.role = 'pill';
    head.replaceWith(fresh);

    var summary = data.summary || stateWord(data.state);
    if (typeof data.ms === 'number') summary += ' · ' + ms(data.ms);
    if (data.cached) summary += ' · cached';
    sub.textContent = summary;

    body.textContent = '';
    // ok is about the call, state is about the answer.  A red block means we
    // could not ask; anything else the check wanted to say is a note.
    if (data.error) {
      body.appendChild(el('p', data.ok === false ? 'card-err' : 'card-note', data.error));
    }
    if (data.state === 'off' || data.state === 'pending') return;
    try {
      body.appendChild(card.render(data));
    } catch (err) {
      body.appendChild(el('p', 'card-err', 'This card could not be rendered.'));
    }
  }

  function markChecking(card) {
    var sec = document.getElementById('card-' + card.key);
    if (!sec) return;
    var head = sec.querySelector('[data-role="pill"]');
    var body = sec.querySelector('[data-role="body"]');
    var fresh = pill('pending', 'Checking');
    fresh.dataset.role = 'pill';
    head.replaceWith(fresh);
    body.textContent = '';
    body.appendChild(skeletonRows(card.skeleton));
  }

  function overallWord(state) {
    if (state === 'up') return 'All systems up';
    if (state === 'down') return 'Attention needed';
    if (state === 'off') return 'Not configured';
    if (state === 'pending') return 'Checking';
    return 'Degraded';
  }

  // Sections that are switched off or not yet checked say nothing about the
  // fleet, so they never drag the headline down.
  function paintOverall(states, latest) {
    var seen = [];
    CARDS.forEach(function (card) {
      var s = states[card.key];
      if (s && s !== 'off' && s !== 'pending') seen.push(s);
    });
    var overall = !seen.length
      ? 'pending'
      : (seen.indexOf('down') >= 0 ? 'down' : (seen.indexOf('warn') >= 0 ? 'warn' : 'up'));

    var fresh = pill(overall, overallWord(overall));
    fresh.id = 'overall';
    fresh.className += ' lg';
    overallEl.replaceWith(fresh);
    overallEl = fresh;

    checkedEl.textContent = latest
      ? new Date(latest).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Chicago' }) + ' CT'
      : '—';
  }

  var inFlight = false;

  // One request per card, all in flight at once.  Asking for everything in a
  // single call made one Worker invocation fan out past Cloudflare's
  // subrequest limit, and the whole page waited on the slowest integration.
  function load() {
    if (inFlight) return;
    inFlight = true;
    refreshBtn.disabled = true;
    grid.classList.add('loading');

    var states = {};
    var latest = 0;
    var outstanding = CARDS.length;

    CARDS.forEach(function (card) {
      markChecking(card);
      fetch('/api/status?section=' + encodeURIComponent(card.key), { cache: 'no-store', headers: { Accept: 'application/json' } })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (payload) {
          var data = payload.data || { ok: false, state: 'warn', summary: 'No data returned' };
          states[card.key] = data.state;
          paintCard(card, data);
          var when = Date.parse(payload.checkedAt || data.checkedAt || '');
          if (when && when > latest) latest = when;
        })
        .catch(function (err) {
          states[card.key] = 'down';
          paintCard(card, {
            ok: false,
            state: 'down',
            summary: 'This section could not be loaded',
            error: String(err.message || err),
            items: []
          });
        })
        .then(function () {
          outstanding -= 1;
          paintOverall(states, latest);
          if (outstanding === 0) {
            grid.classList.remove('loading');
            inFlight = false;
            refreshBtn.disabled = false;
          }
        });
    });
  }

  function runRecallSearch(q) {
    lastRecallQuery = q;
    var box = document.getElementById('recall-results');
    if (!box) return;
    if (!q) {
      box.textContent = '';
      box.appendChild(emptyNode('Search the corpus to see hits.'));
      return;
    }
    box.textContent = '';
    box.appendChild(el('p', 'card-sub', 'Searching for "' + q + '"'));
    fetch('/api/recall/search?q=' + encodeURIComponent(q) + '&limit=8', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        box.textContent = '';
        if (!data.ok) {
          box.appendChild(el('p', 'card-err', data.error || 'The search failed.'));
          return;
        }
        if (!data.hits || !data.hits.length) {
          box.appendChild(emptyNode('No hits for "' + q + '".'));
          return;
        }
        box.appendChild(el('p', 'card-sub',
          data.hits.length + ' hits for "' + q + '"' + (data.mode ? ' · mode ' + data.mode : '')));
        box.appendChild(hitList(data.hits));
      })
      .catch(function (err) {
        box.textContent = '';
        box.appendChild(el('p', 'card-err', String(err.message || err)));
      });
  }

  refreshBtn.addEventListener('click', load);
  buildScaffold();
  load();
  setInterval(load, 60000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) load();
  });
})();
</script>
</body>
</html>
