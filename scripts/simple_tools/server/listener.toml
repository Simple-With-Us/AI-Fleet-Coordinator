# simple-chat listener config for the SERVER instance (the Coolify container on the Hetzner box).
# Design:  docs/protocols/eavesdropper-server.md in AI-Fleet-Coordinator.
#
# It holds no secrets.  Each seat's Zulip email and API key, ZULIP_SITE, and each routine's URL and sender key reach
# the container as environment variables, from one of two sources under the same names.  Infisical (fleet-secrets'
# source) is the intended one;  Coolify copies are the fallback:
#   - Infisical at start:  when Coolify binds a scoped INFISICAL_TOKEN service token, the entrypoint loads
#     the listener's variables from Infisical (project
#     "AI Fleet Coordinator", environment prod, folder /zulip) on every start (server/infisical_env.py), and an
#     Infisical value wins over a Coolify one of the same name;
#   - environment backfills are accepted for names not stored in Infisical; the scoped token is still required.
# ZULIP_SITE is never in Infisical:  Coolify sets it.  The Zulip names are the defaults (ZULIP_<CODE>_EMAIL and
# ZULIP_<CODE>_API_KEY, where CODE is the seat with hyphens as underscores).  A Grok Bot persona's routine reads
# the webhook names Infisical already holds, ZULIP_ALERT_GB_<ROLE>_ENDPOINT (the https URL) and
# ZULIP_ALERT_GB_<ROLE>_KEY (the bare crsr_ key, sent as Authorization: Bearer <key>).  The matching
# ZULIP_ALERT_GB_<ROLE>_HEADER is never read.  Set email_env, key_env or the routine's url_env and key_env to use
# other names.
#
# The container copies this file onto its volume (SIMPLE_TOOLS_CONFIG) on first start.  Then
# `simple-chat daemon init` pins owner_user_id (and the optional eligible_user_ids) in that copy, and
# `simple-chat daemon reload` (or a restart) applies it.  Until then nothing is treated as the
# owner and nothing wakes.  A reload re-reads only this file:  a new or changed environment
# variable reaches the listener only when the container restarts.  A section changed here never reaches a live
# volume by itself:  server/apply_live_config.py copies the JET, GB and BF sections into /data/listener.toml, adds
# [listener_api], [notes_queue], [linear_projects] and [linear_comments] only where the live file has none (it never changes one that
# is there), and leaves [daemon] (the pins) untouched.  Never mount this file as a single file, because `daemon init` replaces it
# atomically.  Every seat here must be "server" in docs/protocols/simple-tools-partition.toml:  a seat is never
# configured in both instances.

[daemon]
instance = "server"
# Sender eligibility also includes the twelve BF bots, and every one of them now holds a
# queue as well (a [seat.BF-*] section each, below):  the allowlist names who may send, the
# sections hold their inboxes (owner, Fri, Nov 6:  every seat working through the Operator).
# WISE is the canonical seat name (identity.py:  INSTINCT is an accepted alias spelling of
# it, and config.py only upper-cases this list, it does not canonicalize aliases), so the
# list names WISE:  an INSTINCT entry here would never match the [seat.WISE] runner or its bot.
# A live volume seeded before this list took this shape keeps its own [daemon] list until it
# is edited by hand (apply_live_config.py never touches [daemon]):  rename INSTINCT to WISE,
# drop the retired BF-BUILDER, and add BF-ENGINEER and BF-TRADER, in the same pass that
# renames the volume's [seat.INSTINCT] section and /data/INSTINCT state to WISE.
outgoing_webhook_seats = ["ECHO", "WISE", "JET", "GB-COMPILER", "GB-DIRECTOR", "GB-TRADER", "GB-DEPLOYER", "GB-DESIGNER", "GB-ORACLE", "GB-PUBLISHER", "GB-PLUMBER", "GB-FIXER", "GB-HOUSEKEEPER", "GB-MONITOR", "GB-ENGINEER", "BF-COMPILER", "BF-DEPLOYER", "BF-DESIGNER", "BF-DIRECTOR", "BF-ENGINEER", "BF-FIXER", "BF-HOUSEKEEPER", "BF-MONITOR", "BF-ORACLE", "BF-PLUMBER", "BF-PUBLISHER", "BF-TRADER"]
owner_user_id = 0                 # pinned by `simple-chat daemon init`, never derived at runtime
eligible_user_ids = []            # optional extra pins:  every fleet bot is eligible at runtime (owner 2026-10-09)
owner_clients = ["website", "ZulipMobile", "ZulipFlutter", "ZulipElectron", "ZulipDesktop"]
stale_after_minutes = 120
coalesce_seconds = 20
coalesce_max_seconds = 90
owner_coalesce_seconds = 5
notify_banners = false            # no display here:  notify-owner writes only <seat>/owner-queue.jsonl
held_alert_minutes = 60           # the `#alerts` held-back digest (AFC-257):  ONE standing message for every
                                  # seat, edited in place at most once an hour (AFC-569).
                                  # Anything held back is posted, not only an eviction (owner, Oct 11 2026);
                                  # the window is what keeps that loud trigger from flooding the channel.  0 is off.
held_alert_seat = "MA"            # IGNORED since Oct 30 2026: the Operator bot carries the digest, never a seat's
                                  # bot (a seat did not say it).  Still read so an old config loads.  The post
                                  # names no one with an @-mention, and #alerts is a presence topic, so it never
                                  # wakes a seat.
peer_broadcast_reminder_minutes = 10   # the peer-broadcast reminder (owner, Oct 27 2026):  how long a fleet bot has to
                                       # explain its `@all` to Jay before the listener DMs him about it.  A bot
                                       # uses `@all` when Jay asks or approves, or on its own judgment in an
                                       # extremely serious situation (an ongoing targeted attack, a fleet-wide
                                       # outage of about twenty minutes);  a bot that uses it without approval DMs
                                       # Jay why.  0 is off.  The reminder is the Operator's DM, never a
                                       # post in a channel, and it never carries the message content.
presence_topics = [["work-in-progress", "roll call"], ["work-in-progress", "fleet"], ["builds", "gates"], ["alerts", "*"]]

# Cloud seats (MA, GROK-WEB, WISE and ECHO):  enabled with wake = "inbox".  JET is the same, but its
# wake is "http" (see its block).  Each holds a queue,
# so its @-mentions and DMs are captured at zero tokens under /data/<SEAT>/, and its key is checked at
# connect (a member or moderator bot, and the key's own bot must be the seat).  They have no wake
# adapter, so nothing is woken, and nothing reads those inboxes yet:  the hosted MCP inbox tool asks
# Zulip itself.  Read one inside the container with `simple-chat inbox --local --as <SEAT>`.  Their
# variables are ZULIP_<CODE>_EMAIL and ZULIP_<CODE>_API_KEY, and they reach the container only when the
# app restarts (a reload does not read the environment).  The partition gives all five to "server".
# Enable only after the public reverse proxy is ready.  Empty tokens deny every seat.
[outgoing_webhook]
enabled = false
bind = "0.0.0.0"
port = 8787

# AFC-326 is a separate, explicit cutover.  This sample and existing live volumes stay off.
[muse_bridge]
enabled = false

# The signed read API (AFC-330, scripts/simple_tools/listener_api.py):  GET /listener/v1/<SEAT>/<record> for
# the hosted Worker's listener_* tools.  Each seat's key is its hmac routine key (JET_ROUTINE_KEY) or
# <CODE>_ROUTINE_KEY, the same value as the Worker's WAKE_HMAC_KEY_<SEAT>;  a seat without one gets 404.
# Read-only.  Enable only after the reverse proxy routes /listener/v1/ here (docs/protocols/eavesdropper-server.md).
[listener_api]
enabled = false
bind = "0.0.0.0"
port = 8788

# The Operator's Apple Notes queue (AFC-486, docs/protocols/operator-notes.md, scripts/simple_tools/notes_queue.py):
# POST /notes/v1/requests, GET /notes/v1/requests/<SEAT>/<request_id>, GET /notes/v1/log and the Mac runner's
# /notes/v1/runner/ routes, on the listener API's port above (so [listener_api] must be enabled too).  No Zulip
# message is involved.  Each principal signs with its own key from Infisical (project AI Fleet Coordinator, prod,
# folder /operator, loaded at start by server/infisical_env.py):  OPERATOR_NOTES_WORKER_KEY (the ST-MCP Worker),
# OPERATOR_NOTES_SERVER_KEY (this server's CLIs and stdio MCP) and OPERATOR_NOTES_RUNNER_KEY (the Mac runner, which
# claims requests and runs apple-notes-coding.sh).  A principal without a key of 32 characters or more is refused
# (404), and the log shows notes-queue-started with the principals that have one, or notes-queue-off.
# worker_seats and server_seats are the seats the WORKER and SERVER principals may act for;  a seat must also be a
# live agent identity.  The server instance only.  Enable after the three keys are in Infisical and the reverse
# proxy routes /notes/v1/ to port 8788, then restart the app (a reload re-reads this file, never the keys).
[notes_queue]
enabled = false
worker_seats = ["JET", "GROK-WEB", "ECHO", "WISE", "CURSOR", "CLAUDE", "CODEX"]
server_seats = ["CLAUDE", "CODEX"]

# The Linear project webhook (AFC-565, scripts/simple_tools/linear_projects_hook.py):
# POST /linear/v1/projects on the listener API's port above (so [listener_api] must be
# enabled too).  Its secrets come from Infisical (project AI Fleet Coordinator, prod,
# folder /operator-linkifiers) through the Coolify runtime-only variable
# OPERATOR_LINKIFIERS_INFISICAL_TOKEN.  Enable after that variable is set and the
# reverse proxy routes /linear/v1/ to port 8788, then restart the app.
[linear_projects]
enabled = false

# The Operator's Zulip -> Linear living comments (scripts/agent_sync/operator_linear.py):
# one standing, edited-in-place comment per (Zulip topic, Linear issue mentioned in it),
# covering the whole topic.  This replaces the standalone linear_relay process and its
# own bot.  Its writes use the owner's Linear developer token (a personal API key with
# Write permission) in Infisical (AI Fleet Coordinator, prod, /linear), fetched at
# daemon start through ONE scoped read-only Infisical service token — bound as the
# runtime-only variable OPERATOR_LINEAR_INFISICAL_TOKEN, or held in the
# infisical_token_file below (a 0600 file;  see docs/operator-linear-comments.md).
# Server instance only.  Enable only after the service token is in place, then
# restart the app.
[linear_comments]
enabled = false
# infisical_token_file = "/data/operator/linear-service-token"

[seat.MA]
instance = "server"
creds = "env"                     # ZULIP_MA_EMAIL, ZULIP_MA_API_KEY (muse-assist-bot@)
wake = "inbox"

# JET (ChatGPT) is woken through OpenAI MCP Events:  the http wake POSTs simple-tools-wake/1 to the hosted
# MCP Worker (https://agents.simplewithus.com/internal/wake/JET), which sends a signed `zulip.mention` event to
# every ChatGPT chat or dot that subscribed (scripts/simple-tools-mcp/ARMING-JAY.md, "Wake Jet").  JET_ROUTINE_URL
# is that URL;  JET_ROUTINE_KEY is the shared HMAC key, the same value as the Worker secret WAKE_HMAC_KEY_JET
# (Infisical Fleet-OPS, `fleet-secrets get JET_ROUTINE_KEY`).  Until both are set and the container restarts, each wake
# is logged as routine-unready and dropped;  the inbox still captures everything.  The budget is explicit
# because every wake starts a ChatGPT task.  A volume seeded before this change keeps JET on "inbox":  switch
# it with the scoped edit in ARMING-JAY.md "Wake Jet", step 1b.
[seat.JET]
instance = "server"
creds = "env"                     # ZULIP_JET_EMAIL, ZULIP_JET_API_KEY (openai-dot-bot@)
wake = "http"
# timeout_seconds stays at 15 or more:  the Worker answers only after it tried ChatGPT (about 10 seconds at
# most), and its 503 asks for this daemon's retry (docs/protocols/simple-tools-mcp.md section 3.12, item 11).
routine = { url_env = "JET_ROUTINE_URL", key_env = "JET_ROUTINE_KEY", method = "POST", auth = "hmac-sha256", header = "X-Simple-Tools-Signature", timeout_seconds = 15 }
budget = { wakes_per_hour = 6, wakes_per_day = 40, per_topic_per_hour = 2, owner_per_day = 30, owner_per_topic_per_hour = 6, usd_per_day = 2.0, board_per_day = 0 }

[seat.GROK-WEB]
instance = "server"
creds = "env"                     # ZULIP_GROK_WEB_EMAIL, ZULIP_GROK_WEB_API_KEY (grok-web-bot@)
wake = "inbox"

