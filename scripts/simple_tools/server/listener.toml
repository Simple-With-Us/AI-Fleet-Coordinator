[seat.BF-PUBLISHER]
instance = "server"
enabled = true
creds = "env"                     # ZULIP_BF_PUBLISHER_EMAIL, ZULIP_BF_PUBLISHER_API_KEY; the site from ZULIP_SITE
wake = "inbox"

# BF-TRADER (BotFleet role).
[seat.BF-TRADER]
instance = "server"
enabled = true
creds = "env"                     # ZULIP_BF_TRADER_EMAIL, ZULIP_BF_TRADER_API_KEY; the site from ZULIP_SITE
wake = "inbox"

# GB-ENGINEER (Engineering seat, engineer-grok-bot@).  Enabled:  the seat's Zulip bot pair, outgoing token and
# ZULIP_ALERT_GB_ENGINEER_ENDPOINT / _KEY are set on the live container like the other personas'.
# apply_live_config.py copies this section to the live volume on the GB- prefix.
[seat.GB-ENGINEER]
instance = "server"
enabled = true
creds = "env"                     # ZULIP_GB_ENGINEER_EMAIL, ZULIP_GB_ENGINEER_API_KEY; the site from ZULIP_SITE
wake = "http"
routine = { url_env = "ZULIP_ALERT_GB_ENGINEER_ENDPOINT", key_env = "ZULIP_ALERT_GB_ENGINEER_KEY", method = "POST", auth = "bearer", header = "Authorization", timeout_seconds = 15 }
budget = { wakes_per_hour = 6, wakes_per_day = 40, per_topic_per_hour = 2, owner_per_day = 20, owner_per_topic_per_hour = 6, usd_per_day = 2.0, board_per_day = 0 }
