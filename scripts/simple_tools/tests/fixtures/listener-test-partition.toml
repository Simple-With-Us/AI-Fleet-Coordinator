# Test partition for the daemon suites:  their configs are per-instance listener configs from
# before the single-server consolidation (the real partition now gives every seat to the server
# instance), and what they exercise is daemon behaviour, not the partition itself.  This file
# keeps the pre-consolidation mapping so those tests mean what they always meant.  Tests of the
# partition itself read the real one (docs/protocols/simple-tools-partition.toml).
