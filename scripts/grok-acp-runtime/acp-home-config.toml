# Stripped Grok home for pm2 grok-acp (--no-leader serve on :12419).
# TUI / grok-leader keep ~/.grok/config.toml and the full MCP set.
# compat.claude.mcps only skips ~/.claude.json.  Grok still auto-enables
# Claude plugins from ~/.claude/plugins (chrome-devtools, Cloudflare, Vercel).
# Put those plugins in disabled so they cannot attach.  session/new then
# passes only opts.mcpServers.

[cli]
auto_update = false
use_leader = false

[ui]
permission_mode = "always-approve"

[models]
default = "grok-4.6"
web_search = "grok-4.5"
default_reasoning_effort = "high"

[compat.claude]
mcps = false
skills = false
rules = false
agents = false
hooks = false
sessions = false

[compat.cursor]
mcps = false
skills = false
rules = false
agents = false
hooks = false
sessions = false

[plugins]
enabled = []
disabled = [
    "cloudflare",
    "vercel",
    "chrome-devtools-mcp",
    "chrome-devtools",
    "render",
    "stripe",
    "resend",
]

[managed_mcps]
enabled = false
gateway_tools_enabled = false

[marketplace]
official_marketplace_auto_installed = false
default_skills_installs_purged = true

[features]
telemetry = false
lsp_tools = false
codebase_indexing = false

# Server names Claude plugins register (not the plugin folder names).
disabled_mcp_servers = [
    "chrome-devtools",
    "cloudflare",
    "cloudflare-api",
    "cloudflare-bindings",
    "cloudflare-builds",
    "cloudflare-docs",
    "cloudflare-observability",
    "vercel",
    "stripe",
    "render",
    "resend",
]

# managed by scripts/install-fleet-rag.sh (fleet-recall)
[mcp_servers.fleet-recall]
command = "python3"
args = ["/Users/jay/apps/fleet-rag/fleet-recall-mcp.py"]
enabled = true
