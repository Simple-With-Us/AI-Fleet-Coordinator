name: Muster
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Developer ID Application
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  Muster:
    type: application
    platform: macOS
    sources:
      - Muster
    settings:
      base:
        PRODUCT_NAME: Muster
        PRODUCT_BUNDLE_IDENTIFIER: services.jays.Muster
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Muster
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: services.jays.Muster.dev
    scheme:
      gatherCoverageData: false
      buildImplicitDependencies: true
      testTargets:
        - MusterTests
  MusterTests:
    type: bundle.unit-test
    platform: macOS
    # Logic tests compile the non-view sources directly rather than hosting the signed app, so
    # they run unsigned anywhere (CI included) with no entitlements or hardened runtime.
    #
    # The `Model/` sources are the app's own logic, and they carry no SwiftUI:  the grid,
    # the store, the surface reader and the contract all compile in a plain test bundle.
    #
    # The `FleetServices/` sources are the ported BotFleet Control core:  the fleet
    # services, the server control API, the process monitor and the remote VM providers.
    # They carry no SwiftUI either and import only Foundation, so they compile in a plain
    # test bundle as well.  Their tests live in `MusterTests/FleetServices/`, which the
    # `MusterTests` directory below already picks up.
    sources:
      - path: MusterTests
      - path: Muster/FleetConfigCLI.swift
      - path: Muster/FleetConfigStatus.swift
      - path: Muster/FleetViewModels.swift
      - path: Muster/ApplyPlanModel.swift
      - path: Muster/ApplyCoordinator.swift
      - path: Muster/Model/ConfigFileReader.swift
      - path: Muster/Model/DriftAlerts.swift
      - path: Muster/Model/DriftHistory.swift
      - path: Muster/Model/DriftMonitor.swift
      - path: Muster/Model/DriftWatcher.swift
      - path: Muster/Model/DriftWatchList.swift
      - path: Muster/Model/EngineIdentity.swift
      - path: Muster/Model/EngineRunner.swift
      - path: Muster/Model/FleetAdmin.swift
      - path: Muster/Model/FleetConfigContract.swift
      - path: Muster/Model/FleetGrid.swift
      - path: Muster/Model/FleetRegistry.swift
      - path: Muster/Model/FleetStore.swift
      - path: Muster/Model/FleetToolsReport.swift
      - path: Muster/Model/ServerStatusReport.swift
      - path: Muster/Model/WorkerHealthReport.swift
      - path: Muster/Model/MacServicesReport.swift
      - path: Muster/Model/OpsAuditLog.swift
      - path: Muster/Model/OpsControl.swift
      - path: Muster/Model/KnobRegistry.swift
      - path: Muster/Model/MiniMaxSurface.swift
      - path: Muster/Model/SeatManifest.swift
      - path: Muster/Model/ListenerConfigFile.swift
      - path: Muster/Model/ListenerStatus.swift
      - path: Muster/Model/OperatorOptions.swift
      - path: Muster/Model/SeatActivity.swift
      - path: Muster/Model/SeatActivityReader.swift
      - path: Muster/Model/WakeLedger.swift
      - path: Muster/Model/WakeSettings.swift
      - path: Muster/Model/WakeSettingsReader.swift
      - path: Muster/Model/WakeSettingsStore.swift
      - path: Muster/Model/WakeSettingsWriter.swift
      - path: Muster/FleetServices/ControlAPI.swift
      - path: Muster/FleetServices/FleetServiceControl.swift
      - path: Muster/FleetServices/FleetServices.swift
      - path: Muster/FleetServices/FleetSecrets.swift
      - path: Muster/FleetServices/FleetSnapshotSequencer.swift
      - path: Muster/FleetServices/ManagedServices.swift
      - path: Muster/FleetServices/McpServerControl.swift
      - path: Muster/FleetServices/OfflineDockerVM.swift
      - path: Muster/FleetServices/OfflineVMHelper.swift
      - path: Muster/FleetServices/PersistencePolicy.swift
      - path: Muster/FleetServices/ProcessMonitor.swift
      - path: Muster/FleetServices/ServerHost.swift
      - path: Muster/FleetServices/ServerPresence.swift
      - path: Muster/FleetServices/StartupPolicy.swift
      - path: Muster/FleetServices/VMProvider.swift
    settings:
      base:
        PRODUCT_NAME: MusterTests
        PRODUCT_BUNDLE_IDENTIFIER: services.jays.Muster.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_CODE_SIGN_FLAGS: ""
