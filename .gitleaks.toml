# Secret scanning config.  It keeps every default gitleaks rule and adds one narrow exception.
#
# docs/muster-ios/server-route-spec.md carries test vectors for the Muster iOS server route
# (PR #1484), and scripts/fixtures/muster-vectors-v5.json carries the same vectors as data for the
# server's tests.  Their device keys are P-256 public keys:  base64 SubjectPublicKeyInfo, which
# always begins with the fixed header MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE.  A public key is not a
# secret, but generic-api-key reads the field names (ownerKey, requestKey and the like) as the
# keyword.
#
# The exception is limited three ways:  only the generic-api-key rule, only those two files, and
# only a matched value that is a whole P-256 public key.  Anything else in those files, and every
# other rule, is still reported.  Per-commit lines in .gitleaksignore are still the way to silence a
# one-off historical finding.

[extend]
useDefault = true

[[allowlists]]
description = "P-256 public keys in the Muster iOS route spec's test vectors and their fixture"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^(docs/muster-ios/server-route-spec\.md|scripts/fixtures/muster-vectors-v5\.json)$''']
regexTarget = "secret"
# A P-256 SubjectPublicKeyInfo is 91 bytes:  122 base64 characters before the "==" padding, which
# the spec's base64url form leaves off.  So the header is followed by exactly 86 characters, from
# either base64 alphabet (the header reads the same in both).
regexes = ['''^MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE[A-Za-z0-9+/_-]{86}(==)?$''']

# The fleet's Infisical service tokens are named after their consumer and grant, for example
# "zulip-linkifiers-operator-ro" or "infra-phase0-ro".  Those names are identifiers:  they say
# which token to look up in the consumer's own store, and the token value itself never appears
# in a file.  The generic-api-key rule reads the word "token" in the constant name as its
# keyword and then scores the account name's entropy, so a name like "infra-phase0-ro" reads
# as a key and is reported.
#
# The exception is limited four ways:  only the generic-api-key rule, only the right-hand
# side of an assignment to a token-account constant, only a value that is one of the account
# names this repository uses, and nothing else.  A real credential that happens to end in
# "-ro" is not one of those names, so it is reported whichever constant holds it, and every
# other rule still reports the file.
#
# A new consumer's account name goes in the list below, and only there.
[[allowlists]]
description = "Infisical service-token account names assigned to a token-account constant"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = [
  '''(?i)\b[A-Za-z0-9_]*(?:TOKEN|ACCOUNT|READER|CREDENTIAL|KEYCHAIN)[A-Za-z0-9_]*\s*(?:=|=>|:)\s*["']?(?:afc-wake-router-ro|alert-ingress-afc-ro|alert-ingress-fleetops-ro|alert-ingress-selftest-ro|apple-notes-ro|cf-usage-watchdog-ro|consumer-ro|cursor-surfaces-ro|dealdex-claude-ro|down-ro)["']?''',
  '''(?i)\b[A-Za-z0-9_]*(?:TOKEN|ACCOUNT|READER|CREDENTIAL|KEYCHAIN)[A-Za-z0-9_]*\s*(?:=|=>|:)\s*["']?(?:fixture-consumer-ro|fleet-apps-sheet-sync-ro|fleet-config-check-ro|fleet-doctor-fleetlink-ro|fleet-doctor-linear-ro|fleet-doctor-zulip-ro|fleet-mode-digest-ro|fleet-tools-ro|fleet-work-backup-ro|grok-acp-ro)["']?''',
  '''(?i)\b[A-Za-z0-9_]*(?:TOKEN|ACCOUNT|READER|CREDENTIAL|KEYCHAIN)[A-Za-z0-9_]*\s*(?:=|=>|:)\s*["']?(?:infra-phase0-ro|install-seat-key-ro|install-seat-key-zulip-ro|ios-publish-ro|ios-testflight-freshness-ro|mac-resource-watch-ro|muster-afc-code-mirrors-ro|muster-afc-ro|muster-afc-wake-router-ro|muster-fleetops-ro)["']?''',
  '''(?i)\b[A-Za-z0-9_]*(?:TOKEN|ACCOUNT|READER|CREDENTIAL|KEYCHAIN)[A-Za-z0-9_]*\s*(?:=|=>|:)\s*["']?(?:notes-client-ro|notes-operator-ro|operator-github-apps-ro|operator-github-callers-ro|operator-thread-registry-ro|other-ro|outbox-bridge-ro|seat-mcp-ro|senate-relay-ro|sheet-read-ro)["']?''',
  '''(?i)\b[A-Za-z0-9_]*(?:TOKEN|ACCOUNT|READER|CREDENTIAL|KEYCHAIN)[A-Za-z0-9_]*\s*(?:=|=>|:)\s*["']?(?:vm-name-ro|vm-ro|wake-ro|worker-health-ro|worker-secret-sync-ro|zulip-linkifiers-operator-ro|zulip-linkifiers-zulip-ro|zulip-operator-ro|zulip-provision-ro|zulip-ro)["']?''',
]
