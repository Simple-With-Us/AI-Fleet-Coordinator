# Hetzner host desired state (Fleet GitOps G1, AFC-369).
# Style matches deploy/mac/manifest.toml (AFC-375): tracked sources only.
# The reconciler copies these files and does not reload systemd or restart units.
# Secret values stay in Infisical. This file names paths and service-token env files, never values.

schema_version = 1
issue = "AFC-369"

[manifest]
repo = "AI-Fleet-Coordinator"
description = "Tracked systemd units, timers, and cron files the repo already contains for the Hetzner host."

# --- Excluded surfaces (never in [[file]]; reconciler does not diff or copy them) ---

[[excluded.unit]]
id = "afc-wake-router.service"
category = "wake-delivery"
source = "scripts/simple_tools/server/afc-wake-router.service"
reason = "Wake router unit. Out of scope for this reconciler."

[[excluded.unit]]
id = "ag-wake-bridge.service"
category = "wake-delivery"
source = "scripts/simple_tools/server/ag-wake-bridge.service"
reason = "Seat wake bridge. Out of scope for this reconciler."

