# --- Absence checks (apply does not delete these) ---

[[forbid]]
id = "fleet-backups-bak"
glob = "etc/cron.d/fleet-backups.bak*"
inventory = "SRV-C10"
note = "Cron reads every file in cron.d, so backup copies of fleet-backups are live duplicate crontabs. Desired state is their absence."

