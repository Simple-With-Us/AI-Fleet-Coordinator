id = "zc-wake-bridge.service"
category = "wake-delivery"
source = "scripts/simple_tools/server/zc-wake-bridge.service"
reason = "Seat wake bridge. Out of scope for this reconciler."

[[excluded.unit]]
id = "operator-sheets-drain.service"
category = "operator"
source = "scripts/simple_tools/server/operator-sheets-drain.service"
reason = "Operator registry export. Out of scope for this reconciler."

[[excluded.unit]]
id = "operator-sheets-drain.timer"
category = "operator"
source = "scripts/simple_tools/server/operator-sheets-drain.timer"
reason = "Operator registry export timer. Out of scope for this reconciler."

[[excluded.unit]]
id = "fleet-server-status.service"
category = "muster"
source = "scripts/systemd/fleet-server-status.service"
reason = "Writes the server status report Muster reads."

[[excluded.unit]]
id = "fleet-server-status.timer"
category = "muster"
source = "scripts/systemd/fleet-server-status.timer"
reason = "Timer for the Muster server status report."

[[excluded.unit]]
id = "fleet-vm-status.service"
category = "muster"
source = "scripts/systemd/fleet-vm-status.service"
reason = "Writes the VM status report Muster's freshness window reads."

[[excluded.unit]]
id = "fleet-vm-status.timer"
category = "muster"
source = "scripts/systemd/fleet-vm-status.timer"
reason = "Timer for the Muster VM status report."

[[excluded.note]]
category = "eavesdropper"
reason = "No eavesdropper unit is desired state here. Do not add one to this manifest."

[[excluded.note]]
category = "session-letter"
reason = "Session letters are the Operator registry and seat hooks, not a host unit."

[[excluded.note]]
category = "routing"
reason = "No message-routing unit is desired state. Wake bridges are excluded above."

[[excluded.note]]
category = "operator"
reason = "codex-operator-coordination-check and afc-jet-operator-wake are Operator units with no body copied from this repo."

[[excluded.note]]
category = "wake-delivery"
reason = "scripts/whatsapp_bridge/wa-bridge.service.example is a review template for the Jet wake bridge and is not installed by this reconciler."

[[excluded.note]]
category = "vendor"
reason = "SRV-C08 e2scrub_all is an OS package cron file, not fleet desired state."

[[excluded.note]]
category = "retired"
reason = "SRV-C09, the root crontab Shellular watchdog, stays absent. The host has no root crontab."

