label = "com.jay.lark-mm-bridge"
note = "Tracked template deploy/com.jay.lark-mm-bridge.plist uses placeholders; live plist hard-codes Lark open ids."

[[gap]]
kind = "launch_agent"
label = "com.jay.lane-placement-watch"
note = "Template scripts/fleet_lanes/templates/com.jay.lane-placement-watch.plist; install is owner-gated."

[[gap]]
kind = "launch_agent"
label = "com.jay.simple-tools.echo-health"
note = "Live-only plist; no tracked template in this repo."

[[gap]]
kind = "launch_agent"
label = "com.jay.fleet-handbook-sync"
note = "Tracked source in Fleet-OPS; no AFC plist template."

[[gap]]
kind = "launch_agent"
label = "com.jay.clutch-auto-update"
