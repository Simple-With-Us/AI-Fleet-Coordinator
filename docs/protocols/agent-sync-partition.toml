# simple-chat listener seat partition.  Owner decision, Thu, Oct 8 (2026-10-08).
#
# The listener runs as two instances of the same package (scripts/agent_sync):
#   mac     the owner's Mac (LaunchAgent com.jay.operator):  every seat that runs on
#           the Mac.  CLAUDE gets live delivery and the tool-less claude -p wake; the others get
#           inbox capture (owner, Thu, Oct 8:  "grok build is on the mac too").
#   server  the Coolify container on the Hetzner box:  the cloud seats (owner, Thu, Oct 8:
#           OpenAI dot (Jet), Muse Assist, the Grok Bots, Instinct and Echo, plus GROK-WEB).
#           GB personas wake through their Grok Bot routine webhooks.  The other cloud seats (MA,
#           JET, GROK-WEB, WISE and ECHO) hold a queue with inbox capture since Fri, Oct 9 (no
#           Mac config can hold them), and get a wake adapter when one exists.
#   none    no listener instance holds the seat.  Only retired names stay here (owner,
#           Fri, Nov 6:  every seat should be working and all through the Operator, so a
#           live seat is never left on "none").
#
# A seat must never be configured in both instances:  two listeners would each hold a queue for
# the same bot and each wake it, and a reply could go out twice.  Every listener reads this file
# (the Mac reads the checkout's copy, the container image carries one) and it fails closed.  A
# listener refuses to start when its listener.toml configures a seat, enabled or not, that this
# file does not give to its own instance:  a seat of the other instance, a `none` seat, or a seat
# that is not listed here at all.  It also refuses a section that reads another listed seat's
# credential (for example [seat.GBC] with bot = "GB-Compiler"), and at connect it refuses a key
# whose users/me identity is not the seat's own bot.  A missing file refuses every seat.
#
# Change an entry only with the owner's OK, in the PR that enables the seat.  Move a seat by
# removing it from one instance's listener.toml before adding it to the other's.

version = 1

[seats]
# The Operator:  a deterministic service, not an agent roster entry.
OPERATOR = "mac"

# Mac seats
CLAUDE = "mac"
CODEX = "mac"
AG = "mac"
CURSOR = "mac"
GROK = "mac"
CLUTCH = "mac"
FX = "mac"
MM = "mac"
MC = "mac"
OPENCODE = "mac"
# ZC, KIMI and AMP are Mac CLI seats like the rest (ZCode, Kimi Code and Amp); they held
# Zulip bots and Infisical credentials all along and were missing only here (owner,
# Fri, Nov 6:  they have seats, and every seat works through the Operator).
ZC = "mac"
KIMI = "mac"
AMP = "mac"

# Cloud seats
MA = "server"
JET = "server"
GROK-WEB = "server"
WISE = "server"
ECHO = "server"

# Grok Bot personas.  GB-DIRECTOR is a realm member now (it was an admin earlier), and
# the listener accepts moderator and member bots only (listener decision 7), so its key is
# accepted.
GB-DIRECTOR = "server"
GB-FIXER = "server"
GB-DESIGNER = "server"
GB-COMPILER = "server"
GB-HOUSEKEEPER = "server"
GB-PUBLISHER = "server"
GB-DEPLOYER = "server"
GB-MONITOR = "server"
GB-PLUMBER = "server"
GB-ORACLE = "server"
GB-TRADER = "server"
# GB-ENGINEER holds a seat like the rest and is enabled in the server sample (see its listener.toml note).
GB-ENGINEER = "server"

# BotFleet role bots.  All twelve live BF seats belong to the server listener (owner,
# Fri, Nov 6:  every seat working, all through the Operator).  BotFleet's source has no wake
# path of its own, so the server listener holds each BF seat's queue with inbox capture —
# the same floor the cloud seats have — and a BF seat gets a wake adapter when one exists.
# BotFleet still assigns the BF-<ROLE> seat at launch, which is the part that is native to it.
#
# The twelve BF seats are the eleven role seats of FLEET-PROTOCOL.md (owner 2026-10-09) with
# BF-ENGINEER in place of BF-BUILDER (owner 2026-11-01), plus BF-TRADER.  BF-PRODUCER is not
# one of them:  it stays off this partition and off the outgoing-webhook allowlist, and stays
# on the board roster so its Linear app signs its writes.  All twelve are outgoing-webhook
# senders, and unlike before they now hold queues too.
#
# BF-BUILDER is retired (owner 2026-11-01:  BF-ENGINEER replaced it).  It stays listed as
# "none" so neither listener can ever hold the retired name.
BF-BUILDER = "none"
BF-COMPILER = "server"
BF-DEPLOYER = "server"
BF-DESIGNER = "server"
BF-FIXER = "server"
BF-HOUSEKEEPER = "server"
BF-MONITOR = "server"
BF-ORACLE = "server"
BF-PLUMBER = "server"
BF-PUBLISHER = "server"
BF-TRADER = "server"
BF-ENGINEER = "server"
BF-DIRECTOR = "server"

# GROK-BUILD is the older code of the GROK seat (terminal Grok and Grok Build are one seat,
# owner 2026-10-08); listed as none so neither name can be held twice.  Every input spelling of
# it is canonicalized to GROK before the partition is read (owner 2026-10-10), so this row is inert.
GROK-BUILD = "none"
